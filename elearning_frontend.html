      handleCourseFilter(e) {
        if (e) e.preventDefault();
        const q = document.getElementById('filter-q').value;
        const cat = document.getElementById('filter-cat').value;
        const diff = document.getElementById('filter-diff').value;
        const sort = document.getElementById('filter-sort').value;
        
        const params = new URLSearchParams();
        if (q) params.set('q', q);
        if (cat && cat !== 'All') params.set('category', cat);
        if (diff && diff !== 'All') params.set('difficulty', diff);
        if (sort && sort !== 'popular') params.set('sort', sort);

        const qs = params.toString();
        this.navigate(qs ? `#/courses?${qs}` : '#/courses');
      }

      renderCourseDetailView(courseId) {
        const u = store.state.currentUser;
        const course = store.state.courses.find(c => c.id === courseId);
        if (!course) {
          return `<div class="container" style="padding: 4rem 1.5rem; text-align: center;"><h2>Course Not Found</h2><a href="#/courses" class="btn btn-primary" style="margin-top: 1rem;">Back to Courses</a></div>`;
        }

        const totalLessons = this.getCourseLessonsCount(course);
        const isEnrolled = u ? this.isUserEnrolled(u.id, course.id) : false;
        const userProgress = isEnrolled ? this.getUserCourseProgress(u.id, course.id) : 0;
        const objectives = (course.learning_objectives || '').split('\n').filter(x => x.trim().length > 0);
        const enrolledStudentsCount = store.state.enrollments.filter(e => e.course_id === course.id).length + 18;

        return `
        <!-- Course Hero Banner -->
        <div style="background: linear-gradient(135deg, #0f172a, #1e293b); color: white; padding: 3.5rem 0 3rem;">
          <div class="container">
            <div style="display: grid; grid-template-columns: 1.3fr 0.7fr; gap: 3rem; align-items: center;">
              <div>
                <div style="display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap;">
                  <span class="badge badge-primary">${escapeHtml(course.category)}</span>
                  <span class="badge" style="background: rgba(255,255,255,0.15); color: white;">${escapeHtml(course.difficulty)}</span>
                  <span class="badge" style="background: rgba(251, 191, 36, 0.2); color: #fbbf24;">
                    <i class="fa-solid fa-star"></i> ${course.rating} (${enrolledStudentsCount} students)
                  </span>
                </div>

                <h1 style="font-size: 2.75rem; color: #ffffff; line-height: 1.2; margin-bottom: 1rem;">
                  ${escapeHtml(course.title)}
                </h1>
                <p style="font-size: 1.1rem; color: #cbd5e1; margin-bottom: 1.75rem; line-height: 1.6;">
                  ${escapeHtml(course.description)}
                </p>

                <div style="display: flex; gap: 2rem; color: #94a3b8; font-size: 0.95rem; flex-wrap: wrap;">
                  <div><i class="fa-solid fa-user-tie" style="color: #818cf8; margin-right: 6px;"></i> Instructor: <strong style="color: white;">${escapeHtml(course.instructor)}</strong></div>
                  <div><i class="fa-solid fa-clock" style="color: #818cf8; margin-right: 6px;"></i> Duration: <strong style="color: white;">${escapeHtml(course.duration)}</strong></div>
                  <div><i class="fa-solid fa-layer-group" style="color: #818cf8; margin-right: 6px;"></i> Modules: <strong style="color: white;">${course.modules ? course.modules.length : 0}</strong></div>
                  <div><i class="fa-solid fa-book-open" style="color: #818cf8; margin-right: 6px;"></i> Lessons: <strong style="color: white;">${totalLessons}</strong></div>
                </div>
              </div>

              <!-- Action Card -->
              <div>
                <div class="card" style="background: white; color: var(--slate-900); padding: 2rem; box-shadow: var(--shadow-xl); border-radius: var(--radius-lg);">
                  <div style="text-align: center; margin-bottom: 1.5rem;">
                    <span style="font-size: 0.85rem; font-weight: 700; color: var(--success); text-transform: uppercase; letter-spacing: 0.05em;">
                      <i class="fa-solid fa-circle-check"></i> Free Enrollment
                    </span>
                    <div style="font-size: 2.25rem; font-weight: 800; color: var(--slate-900); margin: 0.25rem 0;">
                      $0 <span style="font-size: 0.95rem; font-weight: 500; color: var(--slate-400);">Full Access</span>
                    </div>
                    <p style="font-size: 0.85rem; color: var(--slate-500);">Self-paced modules, interactive quizzes & verified tracking</p>
                  </div>

                  ${isEnrolled ? `
                    <div style="background: var(--slate-50); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.25rem;">
                      <div style="display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem;">
                        <span>Enrolled Status</span>
                        <span style="color: var(--primary);">${userProgress}% Completed</span>
                      </div>
                      <div class="progress-container">
                        <div class="progress-bar" style="width: ${userProgress}%;"></div>
                      </div>
                    </div>

                    <a href="#/courses/${course.id}/learn" class="btn btn-primary btn-block btn-lg">
                      <i class="fa-solid fa-play"></i> Continue Learning
                    </a>
                  ` : `
                    <button type="button" onclick="app.enrollUserInCourse(${course.id})" class="btn btn-primary btn-block btn-lg">
                      <i class="fa-solid fa-graduation-cap"></i> Enroll Now
                    </button>
                  `}

                  <ul style="list-style: none; margin-top: 1.5rem; font-size: 0.875rem; color: var(--slate-600); display: flex; flex-direction: column; gap: 0.65rem;">
                    <li><i class="fa-solid fa-check" style="color: var(--success); margin-right: 8px;"></i> Access to all ${totalLessons} lessons</li>
                    <li><i class="fa-solid fa-check" style="color: var(--success); margin-right: 8px;"></i> Structured code examples & notes</li>
                    <li><i class="fa-solid fa-check" style="color: var(--success); margin-right: 8px;"></i> MCQ Assessments with explanations</li>
                    <li><i class="fa-solid fa-check" style="color: var(--success); margin-right: 8px;"></i> Progress saved automatically</li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Main Body: Objectives & Curriculum -->
        <div class="container" style="padding: 3.5rem 1.5rem;">
          <div style="display: grid; grid-template-columns: 1.35fr 0.65fr; gap: 3rem;">
            <div>
              <!-- Learning Objectives -->
              ${objectives.length > 0 ? `
                <div class="card" style="margin-bottom: 2.5rem; border: 1px solid var(--border-color);">
                  <h3 style="font-size: 1.35rem; margin-bottom: 1.25rem;">What You'll Learn</h3>
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    ${objectives.map(obj => `
                      <div style="display: flex; gap: 0.75rem; font-size: 0.95rem; color: var(--slate-700);">
                        <i class="fa-solid fa-circle-check" style="color: var(--primary); margin-top: 4px; flex-shrink: 0;"></i>
                        <span>${escapeHtml(obj)}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <!-- Curriculum Accordion -->
              <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                  <div>
                    <h3 style="font-size: 1.4rem; color: var(--slate-900);">Course Curriculum</h3>
                    <p style="color: var(--slate-500); font-size: 0.9rem;">
                      ${course.modules ? course.modules.length : 0} Modules &bull; ${totalLessons} Lessons &bull; ${course.duration} Total Length
                    </p>
                  </div>
                </div>

                <div style="display: flex; flex-direction: column; gap: 1rem;">
                  ${course.modules ? course.modules.map((module, mIdx) => `
                    <div class="card" style="padding: 0; overflow: hidden; border: 1px solid var(--border-color);">
                      <div style="background: var(--slate-50); padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                        <div>
                          <span style="font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">
                            Module ${mIdx + 1}
                          </span>
                          <h4 style="font-size: 1.1rem; color: var(--slate-900); margin-top: 2px;">${escapeHtml(module.title)}</h4>
                          ${module.description ? `<p style="font-size: 0.85rem; color: var(--slate-500); margin-top: 2px;">${escapeHtml(module.description)}</p>` : ''}
                        </div>
                        <span class="badge badge-slate">${module.lessons ? module.lessons.length : 0} Lessons</span>
                      </div>

                      <div style="padding: 0.5rem 0;">
                        ${module.lessons ? module.lessons.map(lesson => `
                          <div style="display: flex; align-items: center; justify-content: space-between; padding: 0.85rem 1.5rem; border-bottom: 1px solid var(--slate-100); font-size: 0.925rem;">
                            <div style="display: flex; align-items: center; gap: 0.85rem;">
                              <i class="fa-regular fa-circle-play" style="color: var(--primary); font-size: 1.1rem;"></i>
                              <a href="#/courses/${course.id}/lessons/${lesson.id}" style="color: var(--slate-800); font-weight: 500;">${escapeHtml(lesson.title)}</a>
                            </div>
                            <div style="display: flex; align-items: center; gap: 1rem; color: var(--slate-400); font-size: 0.85rem;">
                              <span><i class="fa-regular fa-clock" style="margin-right: 4px;"></i> ${escapeHtml(lesson.duration)}</span>
                            </div>
                          </div>
                        `).join('') : ''}
                      </div>
                    </div>
                  `).join('') : ''}
                </div>
              </div>
            </div>

            <!-- Instructor Sidebar -->
            <div>
              <div class="card" style="border: 1px solid var(--border-color); padding: 1.75rem;">
                <h4 style="font-size: 1.15rem; margin-bottom: 1rem;">Course Instructor</h4>
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                  <div class="avatar-circle" style="width: 48px; height: 48px; font-size: 1.25rem;">
                    ${course.instructor ? course.instructor[0] : 'I'}
                  </div>
                  <div>
                    <h5 style="font-size: 1rem; margin-bottom: 2px;">${escapeHtml(course.instructor)}</h5>
                    <p style="font-size: 0.8rem; color: var(--slate-500);">Senior Engineering Director</p>
                  </div>
                </div>
                <p style="font-size: 0.875rem; color: var(--slate-600); line-height: 1.6;">
                  Over 12 years of hands-on production system architecture and engineering mentorship experience.
                </p>
              </div>
            </div>
          </div>
        </div>
        `;
      }

      renderLessonView(courseId, lessonId) {
        const u = store.state.currentUser;
        const course = store.state.courses.find(c => c.id === courseId);
        if (!course) return `<div class="container" style="padding: 4rem;"><h2>Course Not Found</h2></div>`;

        // Flatten lessons to find current, prev, next
        const allLessons = [];
        if (course.modules) {
          course.modules.forEach(m => {
            if (m.lessons) {
              m.lessons.forEach(l => allLessons.push({ ...l, moduleTitle: m.title }));
            }
          });
        }

        const currIdx = allLessons.findIndex(l => l.id === lessonId);
        const lesson = currIdx !== -1 ? allLessons[currIdx] : allLessons[0];
        if (!lesson) return `<div class="container" style="padding: 4rem;"><h2>Lesson Not Found</h2></div>`;

        const prevLesson = currIdx > 0 ? allLessons[currIdx - 1] : null;
        const nextLesson = currIdx < allLessons.length - 1 ? allLessons[currIdx + 1] : null;

        const isCurrentCompleted = u ? store.state.lesson_progress.some(lp => lp.user_id === u.id && lp.lesson_id === lesson.id && lp.completed) : false;
        const courseProgress = u ? this.getUserCourseProgress(u.id, course.id) : 0;

        // Video embed URL
        let ytUrl = "";
        if (lesson.video_url) {
          if (lesson.video_url.includes('watch?v=')) {
            ytUrl = lesson.video_url.replace('watch?v=', 'embed/');
          } else if (lesson.video_url.includes('youtu.be/')) {
            ytUrl = lesson.video_url.replace('youtu.be/', 'www.youtube.com/embed/');
          } else {
            ytUrl = lesson.video_url;
          }
        }

        return `
        <div class="learning-layout">
          
          <!-- Left Modules & Lessons Sidebar -->
          <aside class="learning-sidebar">
            <div class="learning-sidebar-header">
              <a href="#/courses/${course.id}" style="display: flex; align-items: center; gap: 0.5rem; color: var(--slate-600); font-size: 0.825rem; font-weight: 600; margin-bottom: 0.75rem;">
                <i class="fa-solid fa-arrow-left"></i> Back to Course Overview
              </a>
              <h3 style="font-size: 1.05rem; color: var(--slate-900); margin-bottom: 0.75rem; line-height: 1.3;">
                ${escapeHtml(course.title)}
              </h3>
              <div>
                <div style="display: flex; justify-content: space-between; font-size: 0.775rem; font-weight: 700; color: var(--slate-600); margin-bottom: 0.35rem;">
                  <span>Progress</span>
                  <span id="course-progress-text">${courseProgress}% Completed</span>
                </div>
                <div class="progress-container">
                  <div class="progress-bar" id="course-progress-bar" style="width: ${courseProgress}%;"></div>
                </div>
              </div>
            </div>

            <div class="learning-module-list">
              ${course.modules ? course.modules.map((module, mIdx) => `
                <div class="module-header">
                  <span>Module ${mIdx + 1}: ${escapeHtml(module.title)}</span>
                </div>

                <div>
                  ${module.lessons ? module.lessons.map(l => {
                    const isActive = l.id === lesson.id;
                    const isDone = u ? store.state.lesson_progress.some(lp => lp.user_id === u.id && lp.lesson_id === l.id && lp.completed) : false;
                    return `
                    <a href="#/courses/${course.id}/lessons/${l.id}" 
                       class="learning-lesson-item ${isActive ? 'active' : ''}">
                      <div class="learning-lesson-status ${isDone ? 'status-completed' : isActive ? 'status-active' : 'status-pending'}">
                        ${isDone ? '<i class="fa-solid fa-check"></i>' : isActive ? '<i class="fa-solid fa-play" style="font-size: 0.65rem;"></i>' : '<i class="fa-regular fa-circle" style="font-size: 0.65rem;"></i>'}
                      </div>
                      <div style="flex: 1; overflow: hidden;">
                        <p style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2;">${escapeHtml(l.title)}</p>
                        <span style="font-size: 0.75rem; color: var(--slate-400);"><i class="fa-regular fa-clock"></i> ${escapeHtml(l.duration)}</span>
                      </div>
                    </a>
                    `;
                  }).join('') : ''}
                </div>
              `).join('') : ''}

              <!-- Assessment Link -->
              ${course.assessments && course.assessments.length > 0 ? `
                <div class="module-header" style="background: #fef3c7; color: #b45309; border-top: 1px solid #fde68a;">
                  <span>Course Assessment</span>
                </div>
                <div>
                  ${course.assessments.map(asm => `
                    <a href="#/courses/${course.id}/assessments/${asm.id}" class="learning-lesson-item" style="color: #92400e;">
                      <div class="learning-lesson-status" style="background: #fde68a; color: #b45309;">
                        <i class="fa-solid fa-award"></i>
                      </div>
                      <div>
                        <p style="font-weight: 600;">${escapeHtml(asm.title)}</p>
                        <span style="font-size: 0.75rem; color: #b45309;">Quiz &bull; ${asm.questions ? asm.questions.length : 0} questions</span>
                      </div>
                    </a>
                  `).join('')}
                </div>
              ` : ''}
            </div>
          </aside>

          <!-- Main Lesson Content Pane -->
          <main class="learning-content-pane">
            <div class="learning-body">
              <!-- Breadcrumb & Title -->
              <div style="margin-bottom: 2rem;">
                <span style="font-size: 0.85rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 0.04em;">
                  ${escapeHtml(lesson.moduleTitle || 'Curriculum')}
                </span>
                <h1 style="font-size: 2.25rem; color: var(--slate-900); margin: 0.35rem 0 0.5rem; line-height: 1.25;">
                  ${escapeHtml(lesson.title)}
                </h1>
                <div style="display: flex; gap: 0.75rem; color: var(--slate-500); font-size: 0.85rem; align-items: center; flex-wrap: wrap;">
                  <span class="badge badge-primary"><i class="fa-solid fa-code" style="margin-right: 4px;"></i> Topic: ${escapeHtml(lesson.topic || 'General')}</span>
                  <span><i class="fa-regular fa-clock" style="margin-right: 4px;"></i> ${escapeHtml(lesson.duration)}</span>
                  <span>&bull;</span>
                  <span><i class="fa-solid fa-graduation-cap" style="margin-right: 4px;"></i> ${escapeHtml(course.title)}</span>
                  ${isCurrentCompleted ? `<span class="badge badge-success"><i class="fa-solid fa-check"></i> Completed</span>` : ''}
                </div>
              </div>

              <!-- Video Container -->
              ${lesson.video_url ? `
                <div class="video-container">
                  ${ytUrl.includes('youtube.com') ? `
                    <iframe src="${ytUrl}" title="${escapeHtml(lesson.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                  ` : `
                    <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; background: linear-gradient(135deg, #1e293b, #0f172a);">
                      <i class="fa-solid fa-circle-play" style="font-size: 3.5rem; color: var(--primary); margin-bottom: 1rem;"></i>
                      <h4>Interactive Video Resource Available</h4>
                      <a href="${lesson.video_url}" target="_blank" class="btn btn-primary btn-sm" style="margin-top: 0.75rem;">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Video Stream
                      </a>
                    </div>
                  `}
                </div>
              ` : ''}

              <!-- Lesson Prose -->
              <article class="lesson-prose">
                ${lesson.content || '<p>Lesson contents will be provided here.</p>'}
              </article>

              <!-- Resources Box -->
              ${lesson.resource_url ? `
                <div class="card" style="margin: 2.5rem 0 1.5rem; background: var(--slate-50); border: 1px solid var(--border-color);">
                  <h4 style="font-size: 1.05rem; margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fa-solid fa-folder-open" style="color: var(--primary);"></i> Supplemental Resources & Downloads
                  </h4>
                  <p style="font-size: 0.9rem; color: var(--slate-600); margin-bottom: 1rem;">
                    Access project source code, documentation specifications, and downloadable cheatsheets for this lesson.
                  </p>
                  <a href="${lesson.resource_url}" target="_blank" class="btn btn-secondary btn-sm" style="display: inline-flex;">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Open Resource Material
                  </a>
                </div>
              ` : ''}

              <!-- Key Takeaways Callout -->
              <div class="callout-box">
                <h5 style="color: var(--primary-dark); font-size: 0.95rem; font-weight: 700; margin-bottom: 0.35rem;">
                  <i class="fa-solid fa-lightbulb"></i> Key Takeaway
                </h5>
                <p style="font-size: 0.9rem; color: var(--slate-700); margin: 0;">
                  Active practice solidifies conceptual mastery. Re-type the snippets into your local terminal or editor, observe the output, and test edge conditions.
                </p>
              </div>
            </div>

            <!-- Bottom Navigation Bar -->
            <div class="learning-footer-bar">
              <div>
                ${prevLesson ? `
                  <a href="#/courses/${course.id}/lessons/${prevLesson.id}" class="btn btn-secondary">
                    <i class="fa-solid fa-chevron-left"></i> Previous Lesson
                  </a>
                ` : `
                  <span class="btn btn-secondary" style="opacity: 0.4; cursor: not-allowed;">
                    <i class="fa-solid fa-chevron-left"></i> Previous
                  </span>
                `}
              </div>

              <div>
                ${isCurrentCompleted ? `
                  <button class="btn btn-success" disabled>
                    <i class="fa-solid fa-check"></i> Completed
                  </button>
                ` : `
                  <button type="button" class="btn btn-primary" onclick="app.markLessonComplete(${course.id}, ${lesson.id}, ${nextLesson ? nextLesson.id : 'null'})">
                    <i class="fa-solid fa-circle-check"></i> Mark as Complete
                  </button>
                `}
              </div>

              <div>
                ${nextLesson ? `
                  <a href="#/courses/${course.id}/lessons/${nextLesson.id}" class="btn btn-secondary">
                    Next Lesson <i class="fa-solid fa-chevron-right"></i>
                  </a>
                ` : course.assessments && course.assessments.length > 0 ? `
                  <a href="#/courses/${course.id}/assessments/${course.assessments[0].id}" class="btn btn-primary">
                    <i class="fa-solid fa-award"></i> Take Assessment
                  </a>
                ` : `
                  <a href="#/dashboard" class="btn btn-secondary">
                    Back to Dashboard <i class="fa-solid fa-check"></i>
                  </a>
                `}
              </div>
            </div>
          </main>

        </div>
        `;
      }

      renderAssessmentView(courseId, assessmentId) {
        const u = store.state.currentUser;
        const course = store.state.courses.find(c => c.id === courseId);
        const assessment = course ? course.assessments.find(a => a.id === assessmentId) : null;
        if (!assessment) return `<div class="container" style="padding: 4rem;"><h2>Assessment Not Found</h2></div>`;

        const pastResults = u ? store.state.results.filter(r => r.user_id === u.id && r.assessment_id === assessment.id) : [];

        return `
        <div style="background: var(--slate-50); padding: 3rem 0; min-height: calc(100vh - 180px);">
          <div class="container" style="max-width: 860px;">
            
            <!-- Assessment Header -->
            <div class="card" style="margin-bottom: 2rem; border: 1px solid var(--border-color); padding: 2rem;">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 1rem;">
                <div>
                  <a href="#/courses/${course.id}" style="color: var(--slate-500); font-size: 0.85rem; font-weight: 600;">
                    <i class="fa-solid fa-arrow-left"></i> Back to ${escapeHtml(course.title)}
                  </a>
                  <h1 style="font-size: 1.85rem; color: var(--slate-900); margin: 0.5rem 0 0.35rem;">
                    ${escapeHtml(assessment.title)}
                  </h1>
                  <p style="color: var(--slate-500); font-size: 0.95rem; margin-bottom: 0.5rem;">${escapeHtml(assessment.description || 'Test your conceptual and practical comprehension of the lessons.')}</p>
                  <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                    <span class="badge badge-primary"><i class="fa-solid fa-code"></i> Topic / Skill: ${escapeHtml(assessment.topic || 'General')}</span>
                    <span class="badge badge-slate" style="background: #e2e8f0; color: #475569;"><i class="fa-solid fa-layer-group"></i> ${escapeHtml(course.difficulty)}</span>
                  </div>
                </div>

                <div style="text-align: right;">
                  <span class="badge badge-warning" style="font-size: 0.85rem; padding: 0.4rem 0.8rem;">
                    <i class="fa-solid fa-bullseye"></i> Passing: ${assessment.pass_percentage}%
                  </span>
                  <p style="font-size: 0.8rem; color: var(--slate-400); margin-top: 0.4rem;">
                    ${assessment.questions ? assessment.questions.length : 0} Total Questions
                  </p>
                </div>
              </div>

              <!-- Instructions Box -->
              <div style="background: var(--slate-100); border-radius: var(--radius-md); padding: 1rem 1.25rem; margin-top: 1.5rem; font-size: 0.875rem; color: var(--slate-700);">
                <strong>Instructions:</strong> Select the single best answer for each question. Once submitted, your score, correct answers, and thorough explanations will be automatically displayed.
              </div>
            </div>

            <!-- Questions Form -->
            <form onsubmit="app.handleAssessmentSubmit(event, ${course.id}, ${assessment.id})" id="assessment-form">
              ${assessment.questions ? assessment.questions.map((q, idx) => `
                <div class="question-card">
                  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">
                      Question ${idx + 1} of ${assessment.questions.length}
                    </span>
                  </div>

                ${result.passed ? `
                  <strong style="color: var(--success);"><i class="fa-solid fa-circle-check"></i> ${perfTier}:</strong> Outstanding comprehension! You have demonstrated solid command over the topic <strong>${escapeHtml(assessment.topic || 'General')}</strong>.

            <!-- Question by Question Review -->

              <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                ${assessment.questions ? assessment.questions.map((q, idx) => {
                  const userChoice = result.answers ? result.answers[q.id] : null;
                  const isCorrect = userChoice && userChoice.toUpperCase() === q.correct_option.toUpperCase();

                  const renderOpt = (optKey, optText) => {
                    const isRightAnswer = q.correct_option.toUpperCase() === optKey;
                    const isUserPick = userChoice && userChoice.toUpperCase() === optKey;

                    let bgStyle = "background: var(--slate-50); border: 1px solid var(--slate-200); color: var(--slate-600);";
                    if (isRightAnswer) {
                      bgStyle = "background: #ecfdf5; border: 1.5px solid #10b981; color: #065f46; font-weight: 600;";
                    } else if (isUserPick && !isCorrect) {
                      bgStyle = "background: #fef2f2; border: 1.5px solid #ef4444; color: #991b1b;";
                    }

                    return `
                    <div style="padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.9rem; ${bgStyle}">
                      <strong>${optKey}.</strong> ${escapeHtml(optText)}
                      ${isRightAnswer ? `<span style="float: right; color: var(--success);"><i class="fa-solid fa-check"></i> Correct Answer</span>` : ''}
                      ${isUserPick && !isCorrect ? `<span style="float: right; color: var(--danger);"><i class="fa-solid fa-xmark"></i> Your Selection</span>` : ''}

                  return `

                      </span>
                      <span class="badge ${isCorrect ? 'badge-success' : 'badge-danger'}">

                      </span>
                    </div>

                    <h4 style="font-size: 1.1rem; color: var(--slate-900); margin-bottom: 1.25rem;">
                      ${escapeHtml(q.question_text)}
                    </h4>

                    <div style="display: grid; grid-template-columns: 1fr; gap: 0.65rem; margin-bottom: 1.25rem;">
                      ${renderOpt('A', q.option_a)}
                      ${renderOpt('B', q.option_b)}
                      ${renderOpt('C', q.option_c)}
                      ${renderOpt('D', q.option_d)}
                    </div>

                    ${q.explanation ? `
                      <div style="background: var(--slate-100); border-radius: var(--radius-sm); padding: 0.85rem 1rem; font-size: 0.85rem; color: var(--slate-700);">
                        <strong style="color: var(--slate-900);"><i class="fa-solid fa-circle-info"></i> Explanation:</strong> ${escapeHtml(q.explanation)}
                      </div>
                    ` : ''}
                  </div>
                  `;
                }).join('') : ''}
              </div>
            </div>

          </div>
        </div>
        `;
      }

      renderAdminLayout(path, params) {
        const root = document.getElementById('app-root');
        const u = store.state.currentUser || store.state.users[0]; // Admin fallback

        let adminContent = '';
        if (path === '/admin' || path === '/admin/dashboard') {
          adminContent = this.renderAdminDashboardView();
        } else if (path === '/admin/courses') {
          adminContent = this.renderAdminCoursesView();
        } else if (path === '/admin/courses/new') {
          adminContent = this.renderAdminCourseFormView(null);

            </a>
            <a href="#/admin/students" class="admin-nav-link ${path === '/admin/students' ? 'active' : ''}">
              <i class="fa-solid fa-users"></i> Student Directory
            </a>

            <p style="font-size: 0.7rem; font-weight: 700; text-transform: uppercase; color: #475569; letter-spacing: 0.05em; padding: 0 1rem; margin-top: 1.5rem; margin-bottom: 0.5rem;">

              <div style="padding: 0 0.5rem 1rem; display: flex; align-items: center; gap: 0.75rem;">

            <div>

            </div>

          <div class="stat-card">
            <div class="stat-icon" style="background: #fee2e2; color: #dc2626;">

                      <button type="button" onclick="app.toggleCoursePublish(${c.id})" class="badge ${c.published ? 'badge-success' : 'badge-slate'}" style="cursor: pointer; border: none;">
                        ${c.published ? '<i class="fa-solid fa-eye"></i> Published' : '<i class="fa-solid fa-eye-slash"></i> Draft'}
                      </button>
                    </td>
                    <td style="text-align: right;">
                      <div style="display: inline-flex; gap: 0.35rem;">

            </table>

        `;

      toggleCoursePublish(courseId) {
        const c = store.state.courses.find(x => x.id === courseId);
        if (c) {
          c.published = c.published ? 0 : 1;
          store.save();
          showToast(`Course "${c.title}" is now ${c.published ? 'Published' : 'Draft'}!`, 'success');
          this.handleRoute();
        }
      }

      deleteCourse(courseId) {
        if (confirm('Are you sure you want to delete this course and all its modules/lessons?')) {
          store.state.courses = store.state.courses.filter(c => c.id !== courseId);
          store.save();
          showToast('Course deleted successfully.', 'info');
          this.handleRoute();
        }
      }

      renderAdminCourseFormView(courseId) {
        const isEdit = courseId !== null;

                <label class="form-label" for="cf-dur">Estimated Duration *</label>
                <input type="text" id="cf-dur" class="form-control" value="${isEdit ? escapeHtml(course.duration) : '8 hours'}" required>

            </div>

            <div style="display: flex; gap: 1rem; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">

      handleSaveCourse(e, courseId) {
        e.preventDefault();
        const title = document.getElementById('cf-title').value;
        const description = document.getElementById('cf-desc').value;
        const category = document.getElementById('cf-cat').value;
        const difficulty = document.getElementById('cf-diff').value;
        const instructor = document.getElementById('cf-inst').value;
        const duration = document.getElementById('cf-dur').value;
        const objectives = document.getElementById('cf-obj').value;
        const published = document.getElementById('cf-pub').checked ? 1 : 0;

        if (courseId) {
          const c = store.state.courses.find(x => x.id === courseId);
          if (c) {
            c.title = title;
            c.description = description;
            c.category = category;
            c.difficulty = difficulty;
            c.instructor = instructor;
            c.duration = duration;
            c.learning_objectives = objectives;
            c.published = published;
          }
          showToast('Course updated successfully!', 'success');
        } else {
          const newId = store.state.courses.length > 0 ? Math.max(...store.state.courses.map(x => x.id)) + 1 : 1;
          store.state.courses.push({
            id: newId,
            title,
            description,
            category,
            difficulty,
            instructor,
            duration,
            rating: 5.0,
            learning_objectives: objectives,
            published,
            modules: [],
            assessments: []
          });
          showToast('New course created successfully!', 'success');
        }
        store.save();
        this.navigate('#/admin/courses');
      }

                  <span style="width: 28px; height: 28px; border-radius: var(--radius-sm); background: #e0e7ff; color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem;">

                      <i class="fa-regular fa-file-lines" style="color: var(--primary);"></i>
                      <div>
                        <strong style="color: var(--slate-800); font-size: 0.95rem;">${escapeHtml(lesson.title)}</strong>
                        <div style="display: flex; gap: 0.75rem; font-size: 0.75rem; color: var(--slate-400); margin-top: 2px; align-items: center; flex-wrap: wrap;">

                          <span><i class="fa-regular fa-clock"></i> ${escapeHtml(lesson.duration)}</span>
                          ${lesson.video_url ? `<span><i class="fa-solid fa-video" style="color: var(--success);"></i> Video</span>` : ''}

                    <div style="display: flex; align-items: center; gap: 0.35rem;">
                      <button type="button" class="btn btn-ghost btn-sm" onclick="app.openEditLessonModal(${course.id}, ${module.id}, ${lesson.id})">
                        <i class="fa-solid fa-pen"></i> Edit
                      </button>
                      <button type="button" onclick="app.deleteLesson(${course.id}, ${module.id}, ${lesson.id})" class="btn btn-ghost btn-sm" style="color: var(--danger);">
                        <i class="fa-solid fa-trash"></i>
                      </button>
                    </div>
                  </div>
                `).join('') : `
                  <p style="padding: 1.5rem; text-align: center; color: var(--slate-400); font-size: 0.875rem;">
                    No lessons added to this module yet. Click "Add Lesson" to get started.
                  </p>
                `}
              </div>

            </div>
          `).join('') : `
            <div class="card" style="text-align: center; padding: 3.5rem 2rem;">
              <i class="fa-solid fa-folder-tree" style="font-size: 2.5rem; color: var(--slate-300); margin-bottom: 1rem;"></i>
              <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">No Modules Created Yet</h3>
              <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Start building your syllabus by adding the first module (e.g., "Module 1 — Fundamentals").
              </p>
              <button type="button" class="btn btn-primary" onclick="app.openAddModuleModal(${course.id})">
                <i class="fa-solid fa-plus"></i> Add First Module
              </button>
            </div>
          `}
        </div>
        `;
      }

      openAddModuleModal(courseId) {
        const mc = document.getElementById('modal-container');
        mc.innerHTML = `
        <div class="modal-backdrop show">
          <div class="card" style="max-width: 500px; width: 100%; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
              <h3 style="font-size: 1.25rem;">Add New Module</h3>
              <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="app.saveNewModule(event, ${courseId})">
              <div class="form-group">
                <label class="form-label" for="mod_title">Module Title *</label>
                <input type="text" id="mod_title" class="form-control" placeholder="e.g. Module 1 — Introduction & Setup" required>
              </div>
              <div class="form-group">
                <label class="form-label" for="mod_desc">Description</label>
                <textarea id="mod_desc" class="form-control" placeholder="Brief outline of concepts covered in this module..."></textarea>
              </div>
              <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Module</button>
              </div>
            </form>
          </div>
        </div>
        `;
      }

      saveNewModule(e, courseId) {
        e.preventDefault();
        const course = store.state.courses.find(c => c.id === courseId);
        if (!course) return;

        const title = document.getElementById('mod_title').value;
        const description = document.getElementById('mod_desc').value;

        if (!course.modules) course.modules = [];
        const newId = Date.now();
        course.modules.push({
          id: newId,
          course_id: courseId,
          title,
          description,
          order: course.modules.length + 1,
          lessons: []
        });

        store.save();
        closeModal();
        showToast('Module created successfully!', 'success');
        this.handleRoute();
      }

      deleteModule(courseId, moduleId) {
        if (confirm('Delete this module and all its lessons?')) {
          const course = store.state.courses.find(c => c.id === courseId);
          if (course && course.modules) {
            course.modules = course.modules.filter(m => m.id !== moduleId);
            store.save();
            showToast('Module deleted.', 'info');
            this.handleRoute();
          }
        }
      }

      openAddLessonModal(courseId, moduleId) {
        this.openLessonModal(courseId, moduleId, null);
      }

      openEditLessonModal(courseId, moduleId, lessonId) {
        this.openLessonModal(courseId, moduleId, lessonId);
      }

      openLessonModal(courseId, moduleId, lessonId) {
        const isEdit = lessonId !== null;
        const course = store.state.courses.find(c => c.id === courseId);
        const module = course ? course.modules.find(m => m.id === moduleId) : null;
        const lesson = isEdit && module ? module.lessons.find(l => l.id === lessonId) : null;

        const mc = document.getElementById('modal-container');
        mc.innerHTML = `
        <div class="modal-backdrop show">
          <div class="card" style="max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
              <h3 style="font-size: 1.25rem;">${isEdit ? 'Edit Lesson' : 'Add New Lesson'}</h3>
              <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="app.saveLesson(event, ${courseId}, ${moduleId}, ${isEdit ? lesson.id : 'null'})">
              <div class="form-group">
                <label class="form-label" for="les_title">Lesson Title *</label>
                <input type="text" id="les_title" class="form-control" value="${isEdit ? escapeHtml(lesson.title) : ''}" placeholder="e.g. Variables and Type Casting" required>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                  <label class="form-label" for="les_topic">Topic / Skill Category *</label>
                  <input type="text" id="les_topic" class="form-control" value="${isEdit ? escapeHtml(lesson.topic || 'General') : 'Variables'}" placeholder="e.g. Variables, Loops, SQL" required>
                </div>
                <div class="form-group">
                  <label class="form-label" for="les_dur">Estimated Duration</label>
                  <input type="text" id="les_dur" class="form-control" value="${isEdit ? escapeHtml(lesson.duration) : '15 mins'}" placeholder="e.g. 15 mins">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="les_video">Video URL (YouTube or Stream)</label>
                <input type="text" id="les_video" class="form-control" value="${isEdit ? escapeHtml(lesson.video_url || '') : 'https://www.youtube.com/watch?v=kqtD5dpn9C8'}" placeholder="https://www.youtube.com/watch?v=...">
              </div>

              <div class="form-group">
                <label class="form-label" for="les_content">Lesson Content (HTML supported)</label>
                <textarea id="les_content" class="form-control" style="min-height: 140px;" placeholder="<h2>Lesson Heading</h2><p>Lesson explanation...</p>">${isEdit ? escapeHtml(lesson.content || '') : '<h2>Overview</h2><p>In this lesson, you will learn the fundamental mechanics.</p><div class="code-block">print("Hello world")</div>'}</textarea>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">${isEdit ? 'Save Changes' : 'Create Lesson'}</button>
              </div>
            </form>
          </div>
        </div>
        `;
      }

      saveLesson(e, courseId, moduleId, lessonId) {
        e.preventDefault();
        const course = store.state.courses.find(c => c.id === courseId);
        const module = course ? course.modules.find(m => m.id === moduleId) : null;
        if (!module) return;

        const title = document.getElementById('les_title').value;
        const topic = document.getElementById('les_topic').value;
        const duration = document.getElementById('les_dur').value;
        const video_url = document.getElementById('les_video').value;
        const content = document.getElementById('les_content').value;

        if (lessonId) {
          const l = module.lessons.find(x => x.id === lessonId);
          if (l) {
            l.title = title;
            l.topic = topic;
            l.duration = duration;
            l.video_url = video_url;
            l.content = content;
          }
          showToast('Lesson updated.', 'success');
        } else {
          if (!module.lessons) module.lessons = [];
          const newId = Date.now();
          module.lessons.push({
            id: newId,
            module_id: moduleId,
            title,
            topic,
            duration,
            video_url,
            content,
            order: module.lessons.length + 1
          });
          showToast('Lesson created.', 'success');
        }

        store.save();
        closeModal();
        this.handleRoute();
      }

      deleteLesson(courseId, moduleId, lessonId) {
        if (confirm('Delete this lesson?')) {
          const course = store.state.courses.find(c => c.id === courseId);
          const module = course ? course.modules.find(m => m.id === moduleId) : null;
          if (module && module.lessons) {
            module.lessons = module.lessons.filter(l => l.id !== lessonId);
            store.save();
            showToast('Lesson deleted.', 'info');
            this.handleRoute();
          }
        }
      }

      renderAdminAssessmentsView() {
        const assessments = [];
        store.state.courses.forEach(c => {
          if (c.assessments) {
            c.assessments.forEach(a => assessments.push({ ...a, courseTitle: c.title }));
          }
        });

        return `
        <div class="admin-header">
          <div>
            <h1 style="font-size: 1.85rem; color: var(--slate-900); margin-bottom: 0.25rem;">
              Quizzes & Assessments
            </h1>
            <p style="color: var(--slate-500); font-size: 0.9rem;">
              Manage MCQ knowledge evaluations, question banks, correct options, and pass criteria.
            </p>
          </div>

          <button type="button" class="btn btn-primary" onclick="app.openCreateAssessmentModal()">
            <i class="fa-solid fa-plus"></i> Create New Assessment
          </button>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Assessment Title</th>
                  <th>Topic / Skill</th>
                  <th>Course</th>
                  <th>Total Questions</th>
                  <th>Passing Threshold</th>
                  <th>Submissions</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${assessments.map(a => {
                  const qCount = a.questions ? a.questions.length : 0;
                  const resCount = store.state.results.filter(r => r.assessment_id === a.id).length;

                  return `
                  <tr>
                    <td>
                      <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <div style="width: 38px; height: 38px; border-radius: var(--radius-sm); background: #fef3c7; color: #d97706; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;">
                          <i class="fa-solid fa-award"></i>
                        </div>
                        <div>
                          <strong>${escapeHtml(a.title)}</strong>
                          ${a.description ? `<p style="font-size: 0.75rem; color: var(--slate-400);">${escapeHtml(a.description)}</p>` : ''}
                        </div>
                      </div>
                    </td>
                    <td>
                      <span class="badge badge-primary" style="font-size: 0.8rem;">
                        <i class="fa-solid fa-code"></i> ${escapeHtml(a.topic || 'General')}
                      </span>
                    </td>
                    <td>
                      <strong style="color: var(--slate-800);">${escapeHtml(a.courseTitle)}</strong>
                    </td>
                    <td>
                      <span class="badge badge-slate" style="font-size: 0.8rem;">
                        <i class="fa-solid fa-list-ol"></i> ${qCount} Questions
                      </span>
                    </td>
                    <td>
                      <span class="badge badge-warning">${a.pass_percentage}% Required</span>
                    </td>
                    <td>
                      <strong style="color: var(--slate-800);">${resCount}</strong> attempts
                    </td>
                    <td style="text-align: right;">
                      <div style="display: inline-flex; gap: 0.35rem;">
                        <a href="#/admin/assessments/${a.id}/questions" class="btn btn-secondary btn-sm">
                          <i class="fa-solid fa-list-check"></i> Manage Questions
                        </a>
                        <button type="button" onclick="app.deleteAssessment(${a.id})" class="btn btn-ghost btn-sm" style="color: var(--danger);">
                          <i class="fa-solid fa-trash"></i>
                        </button>
                      </div>
                    </td>
                  </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
        `;
      }

      openCreateAssessmentModal() {
        const mc = document.getElementById('modal-container');
        mc.innerHTML = `
        <div class="modal-backdrop show">
          <div class="card" style="max-width: 560px; width: 100%; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
              <h3 style="font-size: 1.25rem;">Create New Assessment</h3>
              <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form onsubmit="app.saveNewAssessment(event)">
              <div class="form-group">
                <label class="form-label" for="asm_course">Associated Course *</label>
                <select id="asm_course" class="form-control" required>
                  ${store.state.courses.map(c => `<option value="${c.id}">${escapeHtml(c.title)}</option>`).join('')}
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="asm_title">Assessment Title *</label>
                <input type="text" id="asm_title" class="form-control" placeholder="e.g. Comprehensive Python Mastery Exam" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="asm_topic">Topic / Skill *</label>
                <input type="text" id="asm_topic" class="form-control" value="Variables" placeholder="e.g. Variables, Loops, OOP" required>
              </div>

              <div class="form-group">
                <label class="form-label" for="asm_desc">Description / Instructions</label>
                <textarea id="asm_desc" class="form-control" placeholder="Test covering core foundations..."></textarea>
              </div>

              <div class="form-group">
                <label class="form-label" for="asm_pass">Pass Mark Threshold (%)</label>
                <input type="number" id="asm_pass" class="form-control" value="70" min="10" max="100" step="5">
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Create Assessment</button>
              </div>
            </form>
          </div>
        </div>
        `;
      }

      saveNewAssessment(e) {
        e.preventDefault();
        const courseId = parseInt(document.getElementById('asm_course').value);
        const title = document.getElementById('asm_title').value;
        const topic = document.getElementById('asm_topic').value;
        const description = document.getElementById('asm_desc').value;
        const pass_percentage = parseFloat(document.getElementById('asm_pass').value) || 70.0;

        const course = store.state.courses.find(c => c.id === courseId);
        if (!course) return;

        if (!course.assessments) course.assessments = [];
        const newId = Date.now();
        course.assessments.push({
          id: newId,
          course_id: courseId,
          title,
          topic,
          description,
          pass_percentage,
          questions: []
        });

        store.save();
        closeModal();
        showToast('Assessment created successfully!', 'success');
        this.handleRoute();
      }

      deleteAssessment(assessmentId) {
        if (confirm('Delete this assessment and its questions?')) {
          store.state.courses.forEach(c => {
            if (c.assessments) {
              c.assessments = c.assessments.filter(a => a.id !== assessmentId);
            }
          });
          store.save();
          showToast('Assessment deleted.', 'info');
          this.handleRoute();
        }
      }

      renderAdminQuestionsView(assessmentId) {
        let assessment = null;
        let course = null;
        for (const c of store.state.courses) {
          if (c.assessments) {
            const a = c.assessments.find(x => x.id === assessmentId);
            if (a) {
              assessment = a;
              course = c;
              break;
            }
          }
        }

        if (!assessment) return `<div class="container"><h2>Assessment Not Found</h2></div>`;

        return `
        <div class="admin-header">
          <div>
            <a href="#/admin/assessments" style="font-size: 0.85rem; color: var(--slate-500); font-weight: 600;">
              <i class="fa-solid fa-arrow-left"></i> Back to Assessments
            </a>
            <h1 style="font-size: 1.85rem; color: var(--slate-900); margin-top: 0.35rem;">
              Question Bank: ${escapeHtml(assessment.title)}
            </h1>
            <p style="color: var(--slate-500); font-size: 0.9rem;">
              Course: <strong>${escapeHtml(course.title)}</strong> &bull; Passing Threshold: <strong>${assessment.pass_percentage}%</strong>
            </p>
          </div>

          <button type="button" class="btn btn-primary" onclick="app.openQuestionModal(${assessment.id}, null)">
            <i class="fa-solid fa-plus"></i> Add Question
          </button>
        </div>

        <div style="display: flex; flex-direction: column; gap: 1.5rem; max-width: 900px;">
          ${assessment.questions && assessment.questions.length > 0 ? assessment.questions.map((q, idx) => `
            <div class="card" style="padding: 1.75rem; border: 1px solid var(--border-color);">
              <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem;">
                <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase;">
                  Question #${idx + 1}
                </span>
                <div style="display: flex; gap: 0.35rem;">
                  <button type="button" class="btn btn-ghost btn-sm" onclick="app.openQuestionModal(${assessment.id}, ${q.id})">
                    <i class="fa-solid fa-pen"></i> Edit
                  </button>
                  <button type="button" onclick="app.deleteQuestion(${assessment.id}, ${q.id})" class="btn btn-ghost btn-sm" style="color: var(--danger);">
                    <i class="fa-solid fa-trash"></i>
                  </button>
                </div>
              </div>

              <h3 style="font-size: 1.15rem; color: var(--slate-900); margin-bottom: 1.25rem;">${escapeHtml(q.question_text)}</h3>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
                ${['A', 'B', 'C', 'D'].map(letter => {
                  const text = q[`option_${letter.toLowerCase()}`];
                  const isCorrect = q.correct_option === letter;
                  return `
                  <div style="padding: 0.65rem 0.9rem; border-radius: var(--radius-sm); font-size: 0.875rem;
                       ${isCorrect ? 'background: #ecfdf5; border: 1.5px solid #10b981; color: #065f46; font-weight: 600;' : 'background: var(--slate-50); border: 1px solid var(--border-color); color: var(--slate-700);'}">
                    <strong>${letter}.</strong> ${escapeHtml(text)} ${isCorrect ? '<i class="fa-solid fa-check" style="color: var(--success); margin-left: 4px;"></i>' : ''}
                  </div>
                  `;
                }).join('')}
              </div>

              ${q.explanation ? `
                <div style="background: var(--slate-100); border-radius: var(--radius-sm); padding: 0.75rem 1rem; font-size: 0.825rem; color: var(--slate-600);">
                  <strong style="color: var(--slate-800);"><i class="fa-solid fa-circle-info"></i> Explanation:</strong> ${escapeHtml(q.explanation)}
                </div>
              ` : ''}
            </div>
          `).join('') : `
            <div class="card" style="text-align: center; padding: 3.5rem 2rem;">
              <i class="fa-solid fa-circle-question" style="font-size: 2.5rem; color: var(--slate-300); margin-bottom: 1rem;"></i>
              <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">No Questions Created Yet</h3>
              <p style="color: var(--slate-500); font-size: 0.9rem; margin-bottom: 1.5rem;">
                Add MCQ questions with 4 selectable choices, a designated correct answer, and detailed explanations.
              </p>
              <button type="button" class="btn btn-primary" onclick="app.openQuestionModal(${assessment.id}, null)">
                <i class="fa-solid fa-plus"></i> Add First Question
              </button>
            </div>
          `}
        </div>
        `;
      }

      openQuestionModal(assessmentId, questionId) {
        let assessment = null;
        for (const c of store.state.courses) {
          if (c.assessments) {
            const a = c.assessments.find(x => x.id === assessmentId);
            if (a) { assessment = a; break; }
          }
        }
        if (!assessment) return;

        const isEdit = questionId !== null;
        const q = isEdit && assessment.questions ? assessment.questions.find(x => x.id === questionId) : null;

        const mc = document.getElementById('modal-container');
        mc.innerHTML = `
        <div class="modal-backdrop show">
          <div class="card" style="max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
              <h3 style="font-size: 1.25rem;">${isEdit ? 'Edit MCQ Question' : 'Add MCQ Question'}</h3>
              <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form onsubmit="app.saveQuestion(event, ${assessmentId}, ${isEdit ? q.id : 'null'})">
              <div class="form-group">
                <label class="form-label" for="q_prompt">Question Prompt *</label>
                <textarea id="q_prompt" class="form-control" placeholder="What will be the output of the following code snippet?..." required style="min-height: 80px;">${isEdit ? escapeHtml(q.question_text) : ''}</textarea>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Option A *</label>
                  <input type="text" id="q_opt_a" class="form-control" value="${isEdit ? escapeHtml(q.option_a) : ''}" placeholder="Choice A text" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Option B *</label>
                  <input type="text" id="q_opt_b" class="form-control" value="${isEdit ? escapeHtml(q.option_b) : ''}" placeholder="Choice B text" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Option C *</label>
                  <input type="text" id="q_opt_c" class="form-control" value="${isEdit ? escapeHtml(q.option_c) : ''}" placeholder="Choice C text" required>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                  <label class="form-label">Option D *</label>
                  <input type="text" id="q_opt_d" class="form-control" value="${isEdit ? escapeHtml(q.option_d) : ''}" placeholder="Choice D text" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" for="q_corr">Designated Correct Option *</label>
                <select id="q_corr" class="form-control" required>
                  <option value="A" ${isEdit && q.correct_option === 'A' ? 'selected' : ''}>Option A</option>
                  <option value="B" ${isEdit && q.correct_option === 'B' ? 'selected' : ''}>Option B</option>
                  <option value="C" ${isEdit && q.correct_option === 'C' ? 'selected' : ''}>Option C</option>
                  <option value="D" ${isEdit && q.correct_option === 'D' ? 'selected' : ''}>Option D</option>
                </select>
              </div>

              <div class="form-group">
                <label class="form-label" for="q_exp">Explanation / Rationale</label>
                <textarea id="q_exp" class="form-control" placeholder="Explain why the designated option is correct for student review...">${isEdit ? escapeHtml(q.explanation || '') : ''}</textarea>
              </div>

              <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
                <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Save Question</button>
              </div>
            </form>
          </div>
        </div>
        `;
      }

      saveQuestion(e, assessmentId, questionId) {
        e.preventDefault();
        let assessment = null;
        for (const c of store.state.courses) {
          if (c.assessments) {
            const a = c.assessments.find(x => x.id === assessmentId);
            if (a) { assessment = a; break; }
          }
        }
        if (!assessment) return;

        const question_text = document.getElementById('q_prompt').value;
        const option_a = document.getElementById('q_opt_a').value;
        const option_b = document.getElementById('q_opt_b').value;
        const option_c = document.getElementById('q_opt_c').value;
        const option_d = document.getElementById('q_opt_d').value;
        const correct_option = document.getElementById('q_corr').value;
        const explanation = document.getElementById('q_exp').value;

        if (questionId) {
          const q = assessment.questions.find(x => x.id === questionId);
          if (q) {
            q.question_text = question_text;
            q.option_a = option_a;
            q.option_b = option_b;
            q.option_c = option_c;
            q.option_d = option_d;
            q.correct_option = correct_option;
            q.explanation = explanation;
          }
          showToast('Question updated.', 'success');
        } else {
          if (!assessment.questions) assessment.questions = [];
          const newId = Date.now();
          assessment.questions.push({
            id: newId,
            assessment_id: assessmentId,
            question_text,
            option_a,
            option_b,
            option_c,
            option_d,
            correct_option,
            explanation
          });
          showToast('Question added to bank.', 'success');
        }

        store.save();
        closeModal();
        this.handleRoute();
      }

      deleteQuestion(assessmentId, questionId) {
        if (confirm('Delete this question?')) {
          for (const c of store.state.courses) {
            if (c.assessments) {
              const a = c.assessments.find(x => x.id === assessmentId);
              if (a && a.questions) {
                a.questions = a.questions.filter(q => q.id !== questionId);
                break;
              }
            }
          }
          store.save();
          showToast('Question deleted.', 'info');
          this.handleRoute();
        }
      }

      renderAdminStudentsView() {
        const students = store.state.users.filter(u => u.role === 'student');

        return `
        <div class="admin-header">
          <div>
            <h1 style="font-size: 1.85rem; color: var(--slate-900); margin-bottom: 0.25rem;">
              Student Directory
            </h1>
            <p style="color: var(--slate-500); font-size: 0.9rem;">
              Monitor active learners, enrollment engagement, average exam performance, and activity timestamps.
            </p>
          </div>
        </div>

        <div class="card" style="padding: 0; overflow: hidden;">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Email Address</th>
                  <th>Preferred Resource</th>
                  <th>Courses Enrolled</th>
                  <th>Completed Courses</th>
                  <th>Avg Quiz Score</th>
                  <th>Last Activity</th>
                  <th style="text-align: right;">Profile Detail</th>
                </tr>
              </thead>
              <tbody>
                ${students.map(u => {
                  const stats = this.getStudentDashboardStats(u.id);

                  return `
                  <tr>
                    <td>
                      <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <div class="avatar-circle" style="width: 36px; height: 36px; font-size: 0.9rem;">
                          ${u.name[0].toUpperCase()}
                        </div>
                        <div>
                          <strong>${escapeHtml(u.name)}</strong>
                          <p style="font-size: 0.75rem; color: var(--slate-400);">Joined Recently</p>
                        </div>
                      </div>
                    </td>
                    <td>${escapeHtml(u.email)}</td>
                    <td>
                      <span class="badge badge-slate" style="background: #e0e7ff; color: var(--primary); font-size: 0.75rem;">
                        <i class="fa-solid fa-graduation-cap"></i> ${escapeHtml(u.preferred_resource_type || 'Mixed')}
                      </span>
                    </td>
                    <td>
                      <span class="badge badge-primary">${stats.enrolledCount} Enrolled</span>
                    </td>
                    <td>
                      <span class="badge badge-success">${stats.completedCoursesCount} Completed</span>
                    </td>
                    <td>
                      <strong style="color: ${stats.avgScore >= 70 ? 'var(--success)' : stats.avgScore > 0 ? 'var(--warning)' : 'var(--slate-400)'};">
                        ${stats.avgScore}%
                      </strong>
                    </td>
                    <td>
                      <span style="font-size: 0.85rem; color: var(--slate-500);">
                        Oct 08, 2026
                      </span>
                    </td>
                    <td style="text-align: right;">
                      <button type="button" class="btn btn-secondary btn-sm" onclick="app.viewStudentModal('${escapeHtml(u.name)}', '${escapeHtml(u.email)}', ${stats.enrolledCount}, ${stats.completedCoursesCount}, ${stats.avgScore}, '${escapeHtml(u.bio || 'No bio provided.')}', '${escapeHtml(u.preferred_resource_type || 'Mixed')}')">
                        <i class="fa-solid fa-id-card"></i> View Stats
                      </button>
                    </td>
                  </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </div>
        `;
      }

      viewStudentModal(name, email, enrolled, completed, avg, bio, pref) {
        const mc = document.getElementById('modal-container');
        mc.innerHTML = `
        <div class="modal-backdrop show">
          <div class="card" style="max-width: 520px; width: 100%; padding: 2rem;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
              <h3 style="font-size: 1.25rem;">Student Learning Profile</h3>
              <button type="button" class="btn btn-ghost btn-sm" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border-color);">
              <div class="avatar-circle" style="width: 52px; height: 52px; font-size: 1.4rem;">
                ${name[0].toUpperCase()}
              </div>
              <div>
                <h4 style="font-size: 1.15rem; color: var(--slate-900); margin-bottom: 2px;">${name}</h4>
                <p style="font-size: 0.85rem; color: var(--slate-500); margin-bottom: 4px;">${email}</p>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                  <span style="font-size: 0.75rem; color: var(--slate-400);">Joined 2026</span>
                  <span class="badge badge-primary" style="font-size: 0.7rem;">Preference: ${pref}</span>
                </div>
              </div>
            </div>

            <!-- 3 Metrics -->
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; text-align: center; margin-bottom: 1.5rem;">
              <div style="background: var(--slate-50); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem;">
                <p style="font-size: 1.5rem; font-weight: 800; color: var(--slate-900); line-height: 1;">${enrolled}</p>
                <span style="font-size: 0.75rem; color: var(--slate-500); text-transform: uppercase;">Enrolled</span>
              </div>
              <div style="background: var(--slate-50); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem;">
                <p style="font-size: 1.5rem; font-weight: 800; color: var(--success); line-height: 1;">${completed}</p>
                <span style="font-size: 0.75rem; color: var(--slate-500); text-transform: uppercase;">Finished</span>
              </div>
              <div style="background: var(--slate-50); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 1rem;">
                <p style="font-size: 1.5rem; font-weight: 800; color: var(--primary); line-height: 1;">${avg}%</p>
                <span style="font-size: 0.75rem; color: var(--slate-500); text-transform: uppercase;">Avg Score</span>
              </div>
            </div>

            <div style="background: var(--slate-50); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem;">
              <h5 style="font-size: 0.85rem; font-weight: 700; color: var(--slate-700); margin-bottom: 0.35rem;">Bio & Objectives</h5>
              <p style="font-size: 0.85rem; color: var(--slate-600); margin: 0;">${bio}</p>
            </div>

            <div style="display: flex; justify-content: flex-end;">
              <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
            </div>
          </div>
        </div>
        `;
      }
    }

    // Initialize application on DOM ready
    let app;
    document.addEventListener("DOMContentLoaded", () => {
      app = new EduPulseApp();
    });
  </script>
</body>
</html>
