<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduPulse — Interactive E-Learning Platform (Standalone Demo)</title>
  <meta name="description" content="Standalone frontend version of EduPulse E-Learning Platform for lab demonstration.">
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Chart.js (CDN with built-in Canvas/SVG fallback if offline) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
/* ===================================================================
   EduPulse E-Learning Platform - Modern SaaS Design System
   =================================================================== */

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap');

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --primary-dark: #3730a3;
  --secondary: #0ea5e9;
  --accent: #8b5cf6;
  
  --success: #10b981;
  --success-light: #ecfdf5;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --danger: #ef4444;
  --danger-light: #fef2f2;
  --info: #3b82f6;

  --slate-50: #f8fafc;
  --slate-100: #f1f5f9;
  --slate-200: #e2e8f0;
  --slate-300: #cbd5e1;
  --slate-400: #94a3b8;
  --slate-500: #64748b;
  --slate-600: #475569;
  --slate-700: #334155;
  --slate-800: #1e293b;
  --slate-900: #0f172a;

  --bg-main: #f8fafc;
  --card-bg: #ffffff;
  --border-color: #e2e8f0;
  --text-main: #0f172a;
  --text-muted: #64748b;

  --font-heading: 'Plus Jakarta Sans', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'Fira Code', monospace;

  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);

  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--slate-900);
  line-height: 1.25;
  font-weight: 700;
}

a {
  color: var(--primary);
  text-decoration: none;
  transition: var(--transition);
}

a:hover {
  color: var(--primary-hover);
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

/* ================= Containers & Layout ================= */
.container {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

.container-fluid {
  width: 100%;
  padding: 0 1.5rem;
}

.main-content {
  flex: 1;
}

/* ================= Navbar ================= */
.navbar {
  background: #ffffff;
  border-bottom: 1px solid var(--border-color);
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 1px 3px 0 rgba(0,0,0,0.03);
}

.nav-wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 72px;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-family: var(--font-heading);
  font-size: 1.35rem;
  font-weight: 800;
  color: var(--slate-900);
  text-decoration: none;
}

.brand-icon {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 2rem;
  list-style: none;
}

.nav-link {
  font-weight: 500;
  color: var(--slate-600);
  font-size: 0.95rem;
  transition: var(--transition);
}

.nav-link:hover, .nav-link.active {
  color: var(--primary);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

/* Dropdown menu */
.user-dropdown {
  position: relative;
}

.avatar-btn {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  background: transparent;
  border: 1px solid var(--border-color);
  padding: 0.35rem 0.75rem;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: var(--transition);
}

.avatar-btn:hover {
  background: var(--slate-50);
}

.avatar-circle {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-full);
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.9rem;
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  background: white;
  min-width: 210px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border-color);
  padding: 0.5rem;
  display: none;
  z-index: 100;
}

.dropdown-menu.show {
  display: block;
}

.dropdown-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.65rem 0.85rem;
  font-size: 0.9rem;
  color: var(--slate-700);
  border-radius: var(--radius-sm);
  transition: var(--transition);
}

.dropdown-item:hover {
  background: var(--slate-100);
  color: var(--primary);
}

.dropdown-divider {
  height: 1px;
  background: var(--border-color);
  margin: 0.4rem 0;
}

/* ================= Buttons ================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  padding: 0.65rem 1.25rem;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid transparent;
  text-decoration: none;
  white-space: nowrap;
}

.btn-sm {
  padding: 0.4rem 0.85rem;
  font-size: 0.85rem;
}

.btn-lg {
  padding: 0.85rem 1.75rem;
  font-size: 1.05rem;
}

.btn-primary {
  background: var(--primary);
  color: #ffffff;
}
.btn-primary:hover {
  background: var(--primary-hover);
  color: #ffffff;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
}

.btn-secondary {
  background: #ffffff;
  color: var(--slate-700);
  border-color: var(--slate-300);
}
.btn-secondary:hover {
  background: var(--slate-50);
  border-color: var(--slate-400);
  color: var(--slate-900);
}

.btn-outline-primary {
  background: transparent;
  color: var(--primary);
  border-color: var(--primary);
}
.btn-outline-primary:hover {
  background: var(--primary-light);
  color: var(--primary-hover);
}

.btn-success {
  background: var(--success);
  color: white;
}
.btn-success:hover {
  background: #059669;
  color: white;
}

.btn-danger {
  background: var(--danger);
  color: white;
}
.btn-danger:hover {
  background: #dc2626;
  color: white;
}

.btn-ghost {
  background: transparent;
  color: var(--slate-600);
}
.btn-ghost:hover {
  background: var(--slate-100);
  color: var(--slate-900);
}

.btn-block {
  width: 100%;
}

/* ================= Cards ================= */
.card {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}

.card-hover:hover {
  box-shadow: var(--shadow-lg);
  transform: translateY(-2px);
  border-color: #cbd5e1;
}

/* ================= Badges ================= */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  padding: 0.25rem 0.65rem;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.badge-primary {
  background: var(--primary-light);
  color: var(--primary);
}

.badge-success {
  background: var(--success-light);
  color: var(--success);
}

.badge-warning {
  background: var(--warning-light);
  color: var(--warning);
}

.badge-danger {
  background: var(--danger-light);
  color: var(--danger);
}

.badge-slate {
  background: var(--slate-100);
  color: var(--slate-600);
}

/* ================= Forms & Inputs ================= */
.form-group {
  margin-bottom: 1.25rem;
}

.form-label {
  display: block;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--slate-700);
  margin-bottom: 0.4rem;
}

.form-control {
  width: 100%;
  padding: 0.7rem 0.95rem;
  border: 1px solid var(--slate-300);
  border-radius: var(--radius-md);
  font-size: 0.95rem;
  font-family: inherit;
  color: var(--slate-900);
  background: #ffffff;
  transition: var(--transition);
}

.form-control:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

textarea.form-control {
  min-height: 100px;
  resize: vertical;
}

.input-icon-wrapper {
  position: relative;
}

.input-icon-wrapper i {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--slate-400);
}

.input-icon-wrapper .form-control {
  padding-left: 2.75rem;
}

/* ================= Progress Bar ================= */
.progress-container {
  width: 100%;
  background: var(--slate-200);
  border-radius: var(--radius-full);
  height: 8px;
  overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  border-radius: var(--radius-full);
  transition: width 0.4s ease;
}

.progress-bar-success {
  background: var(--success);
}

/* ================= Alerts & Toasts ================= */
.alert {
  padding: 0.9rem 1.25rem;
  border-radius: var(--radius-md);
  margin-bottom: 1.25rem;
  font-size: 0.925rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.alert-danger {
  background: var(--danger-light);
  border: 1px solid #fecaca;
  color: #b91c1c;
}

.alert-success {
  background: var(--success-light);
  border: 1px solid #a7f3d0;
  color: #047857;
}

.alert-info {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  color: #1d4ed8;
}

/* ================= Hero Section ================= */
.hero-section {
  padding: 5rem 0 4rem;
  background: radial-gradient(circle at 80% 20%, rgba(224, 231, 255, 0.6) 0%, rgba(248, 250, 252, 1) 70%);
  position: relative;
  overflow: hidden;
}

.hero-grid {
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  align-items: center;
  gap: 3.5rem;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: white;
  border: 1px solid var(--border-color);
  padding: 0.4rem 0.9rem;
  border-radius: var(--radius-full);
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--primary);
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-sm);
}

.hero-title {
  font-size: 3.5rem;
  font-weight: 800;
  letter-spacing: -0.025em;
  margin-bottom: 1.25rem;
  color: var(--slate-900);
}

.hero-title span {
  background: linear-gradient(135deg, var(--primary), var(--accent));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-desc {
  font-size: 1.15rem;
  color: var(--slate-600);
  margin-bottom: 2rem;
  max-width: 540px;
}

.hero-cta {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.hero-visual {
  position: relative;
}

.hero-card-preview {
  background: white;
  border-radius: var(--radius-lg);
  padding: 1.75rem;
  box-shadow: var(--shadow-xl);
  border: 1px solid var(--border-color);
}

/* ================= Section Header ================= */
.section-header {
  margin-bottom: 2.5rem;
}

.section-tag {
  color: var(--primary);
  font-weight: 700;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 0.5rem;
}

.section-title {
  font-size: 2.2rem;
  color: var(--slate-900);
  margin-bottom: 0.5rem;
}

.section-subtitle {
  color: var(--slate-500);
  font-size: 1.05rem;
}

/* ================= Course Cards Grid ================= */
.courses-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1.75rem;
}

.course-card {
  display: flex;
  flex-direction: column;
  background: white;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: var(--transition);
}

.course-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-xl);
  border-color: #cbd5e1;
}

.course-thumb-wrapper {
  position: relative;
  aspect-ratio: 16 / 9;
  background: linear-gradient(135deg, #1e1b4b, #312e81);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
}

.course-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.course-thumb-overlay {
  position: absolute;
  top: 0.75rem;
  left: 0.75rem;
  right: 0.75rem;
  display: flex;
  justify-content: space-between;
}

.course-body {
  padding: 1.25rem;
  display: flex;
  flex-direction: column;
  flex: 1;
}

.course-category {
  font-size: 0.775rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--primary);
  margin-bottom: 0.35rem;
}

.course-title {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--slate-900);
  margin-bottom: 0.5rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  line-height: 1.35;
}

.course-desc {
  font-size: 0.875rem;
  color: var(--slate-500);
  margin-bottom: 1rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.course-meta {
  display: flex;
  align-items: center;
  gap: 1rem;
  font-size: 0.825rem;
  color: var(--slate-500);
  margin-top: auto;
  padding-top: 0.85rem;
  border-top: 1px solid var(--slate-100);
}

.course-footer {
  padding: 0 1.25rem 1.25rem;
}

/* ================= Student Dashboard & Sidebar ================= */
.dashboard-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  min-height: calc(100vh - 72px);
}

.sidebar {
  background: white;
  border-right: 1px solid var(--border-color);
  padding: 1.75rem 1.25rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.sidebar-title {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--slate-400);
  letter-spacing: 0.05em;
  padding: 0 0.75rem;
  margin: 1rem 0 0.5rem;
}

.sidebar-link {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.75rem 1rem;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.925rem;
  color: var(--slate-600);
  transition: var(--transition);
}

.sidebar-link:hover {
  background: var(--slate-100);
  color: var(--slate-900);
}

.sidebar-link.active {
  background: var(--primary-light);
  color: var(--primary);
}

.dashboard-main {
  padding: 2.25rem;
  background: var(--bg-main);
}

/* Stats Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.5rem;
  margin-bottom: 2rem;
}

.stat-card {
  background: white;
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  display: flex;
  align-items: center;
  gap: 1.25rem;
  box-shadow: var(--shadow-sm);
}

.stat-icon {
  width: 52px;
  height: 52px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
}

.stat-val {
  font-size: 1.75rem;
  font-weight: 800;
  color: var(--slate-900);
  line-height: 1.1;
}

.stat-label {
  font-size: 0.85rem;
  color: var(--slate-500);
  font-weight: 500;
}

/* ================= Learning Room (Lesson View) ================= */
.learning-layout {
  display: grid;
  grid-template-columns: 340px 1fr;
  height: calc(100vh - 72px);
  overflow: hidden;
}

.learning-sidebar {
  background: #ffffff;
  border-right: 1px solid var(--border-color);
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow-y: auto;
}

.learning-sidebar-header {
  padding: 1.25rem;
  border-bottom: 1px solid var(--border-color);
  background: var(--slate-50);
}

.learning-module-list {
  padding: 1rem 0;
}

.module-header {
  padding: 0.75rem 1.25rem;
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--slate-500);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  background: var(--slate-100);
  border-top: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
}

.learning-lesson-item {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  padding: 0.85rem 1.25rem;
  color: var(--slate-700);
  font-size: 0.9rem;
  font-weight: 500;
  border-left: 3px solid transparent;
  transition: var(--transition);
  text-decoration: none;
}

.learning-lesson-item:hover {
  background: var(--slate-50);
  color: var(--slate-900);
}

.learning-lesson-item.active {
  background: var(--primary-light);
  color: var(--primary);
  border-left-color: var(--primary);
  font-weight: 600;
}

.learning-lesson-status {
  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  flex-shrink: 0;
}

.status-completed {
  background: #d1fae5;
  color: #059669;
}

.status-active {
  background: var(--primary);
  color: white;
}

.status-pending {
  border: 1px solid var(--slate-300);
  color: var(--slate-400);
}

.learning-content-pane {
  display: flex;
  flex-direction: column;
  height: 100%;
  overflow-y: auto;
  background: #ffffff;
}

.learning-body {
  padding: 2.5rem 3rem;
  flex: 1;
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
}

.video-container {
  position: relative;
  aspect-ratio: 16 / 9;
  background: #000000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  margin-bottom: 2rem;
  box-shadow: var(--shadow-lg);
}

.video-container iframe {
  width: 100%;
  height: 100%;
  border: none;
}

.lesson-prose {
  font-size: 1.05rem;
  line-height: 1.8;
  color: var(--slate-800);
}

.lesson-prose h2, .lesson-prose h3 {
  margin: 2rem 0 1rem;
}

.lesson-prose p {
  margin-bottom: 1.25rem;
}

.code-block {
  background: var(--slate-900);
  color: #f8fafc;
  padding: 1.25rem 1.5rem;
  border-radius: var(--radius-md);
  font-family: var(--font-mono);
  font-size: 0.9rem;
  overflow-x: auto;
  margin: 1.5rem 0;
  position: relative;
}

.callout-box {
  background: var(--primary-light);
  border-left: 4px solid var(--primary);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;

/tutorial/interpreter.html", "duration": "15 mins", "order": 1, "topic": "Variables"}, {"id": 2, "module_id": 1, "title": "Variables, Primitive Types & Type Casting", "content": "<h2>Understanding Python Primitives</h2>\n<p>In Python, everything is an object. Variables are references (pointers) to objects stored in memory. The core scalar primitives include:</p>\n<ul>\n  <li><code>int</code>: Arbitrary-precision integers</li>\n  <li><code>float</code>: 64-bit IEEE 754 floating-point numbers</li>\n  <li><code>str</code>: Immutable sequence of Unicode code points</li>\n  <li><code>bool</code>: Boolean subtype of integer (<code>True</code> or <code>False</code>)</li>\n</ul>\n<div class=\"code-block\">\nuser_age: int = 24\naccount_balance: float = 1250.75\nuser_name: str = \"Alice\"\nis_verified: bool = True\n\n# Type casting\nage_str = str(user_age)\nprint(f\"User {user_name} has balance ${account_balance:.2f}\")\n</div>", "video_url": "https://www.youtube.com/watch?v=cQT33yu9pY8", "resource_url": "https://docs.python.org/3/library/stdtypes.html", "duration": "20 mins", "order": 2, "topic": "Variables"}, {"id": 3, "module_id": 1, "title": "Operators, Truthiness & Expressions", "content": "<h2>Arithmetic & Logical Expressions</h2>\n<p>Python provides comprehensive arithmetic, comparison, and boolean logical operators.</p>\n<div class=\"code-block\">\na = 15\nb = 4\n\nprint(\"Division:\", a / b)       # 3.75 (float)\nprint(\"Floor Division:\", a // b) # 3 (int)\nprint(\"Modulo:\", a % b)         # 3\nprint(\"Exponentiation:\", a ** b) # 50625\n\n# Short-circuit logic\nis_admin = True\nhas_permission = False\ncan_edit = is_admin or has_permission\nprint(\"Can edit:\", can_edit)\n</div>", "video_url": null, "resource_url": "https://docs.python.org/3/reference/expressions.html", "duration": "18 mins", "order": 3, "topic": "Variables"}]}, {"id": 2, "course_id": 1, "title": "Module 2 — Control Flow & Iteration", "description": "Conditional branching, loops, and comprehensions.", "order": 2, "lessons": [{"id": 4, "module_id": 2, "title": "Conditional Statements: if, elif, and else", "content": "<h2>Branching Execution Paths</h2>\n<p>Conditionals allow programs to execute specific blocks based on boolean predicate evaluations.</p>\n<div class=\"code-block\">\nscore = 85\n\nif score >= 90:\n    grade = 'A'\nelif score >= 80:\n    grade = 'B'\nelif score >= 70:\n    grade = 'C'\nelse:\n    grade = 'F'\n\nprint(f\"Assigned Grade: {grade}\")\n</div>", "video_url": null, "resource_url": "https://docs.python.org/3/tutorial/controlflow.html", "duration": "15 mins", "order": 1, "topic": "Loops"}, {"id": 5, "module_id": 2, "title": "For Loops, While Loops & Comprehensions", "content": "<h2>Idiomatic Iteration in Python</h2>\n<p>Python emphasizes iterable sequences and list comprehensions over traditional index-based iteration counters.</p>\n<div class=\"code-block\">\n# Iterating over collections\nfruits = [\"apple\", \"banana\", \"cherry\"]\nfor index, fruit in enumerate(fruits, start=1):\n    print(f\"{index}. {fruit.capitalize()}\")\n\n# Modern List Comprehension\nsquares = [x ** 2 for x in range(1, 11) if x % 2 == 0]\nprint(\"Even Squares:\", squares) # [4, 16, 36, 64, 100]\n</div>", "video_url": "https://www.youtube.com/watch?v=6iF8Xb7Z3wQ", "resource_url": "https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions", "duration": "25 mins", "order": 2, "topic": "Loops"}]}, {"id": 3, "course_id": 1, "title": "Module 3 — Functions & Modular Architecture", "description": "Function definitions, parameters, return types, and scope.", "order": 3, "lessons": [{"id": 6, "module_id": 3, "title": "Defining Functions, *args, and **kwargs", "content": "<h2>Designing Reusable Functions</h2>\n<p>Functions encapsulate business logic and enable clean modular code organization.</p>\n<div class=\"code-block\">\ndef calculate_tax(subtotal: float, tax_rate: float = 0.08) -> float:\n    \"\"\"Calculates applicable tax on a transaction.\"\"\"\n    return round(subtotal * tax_rate, 2)\n\ndef log_event(event_name: str, *tags, **metadata):\n    print(f\"[EVENT] {event_name}\")\n    print(f\"Tags: {tags}\")\n    print(f\"Metadata: {metadata}\")\n\nlog_event(\"user_login\", \"security\", \"auth\", user_id=101, ip=\"127.0.0.1\")\n</div>", "video_url": "https://www.youtube.com/watch?v=9Os0o3wzS_I", "resource_url": "https://docs.python.org/3/tutorial/controlflow.html#defining-functions", "duration": "22 mins", "order": 1, "topic": "Functions"}]}], "assessments": [{"id": 1, "course_id": 1, "title": "Python Programming Fundamentals Assessment", "description": "Test your grasp on core Python data types, loops, list comprehensions, and function signatures.", "pass_percentage": 70.0, "topic": "Variables & Loops", "questions": [{"id": 1, "assessment_id": 1, "question_text": "What is the output of `type([])` in Python 3?", "option_a": "<class 'array'>", "option_b": "<class 'list'>", "option_c": "<class 'tuple'>", "option_d": "<class 'collection'>", "correct_option": "B", "explanation": "In Python, square brackets [] define a built-in list object, which belongs to the class 'list'."}, {"id": 2, "assessment_id": 1, "question_text": "Which of the following creates an empty set in Python?", "option_a": "{}", "option_b": "set()", "option_c": "[]", "option_d": "dict()", "correct_option": "B", "explanation": "{} creates an empty dictionary in Python. To initialize an empty set, you must use the set() constructor."}, {"id": 3, "assessment_id": 1, "question_text": "What is the evaluated output of the expression `[x * 2 for x in range(3)]`?", "option_a": "[0, 2, 4]", "option_b": "[2, 4, 6]", "option_c": "[1, 2, 3]", "option_d": "[0, 1, 2]", "correct_option": "A", "explanation": "range(3) produces numbers 0, 1, 2. Multiplying each by 2 yields [0, 2, 4]."}, {"id": 4, "assessment_id": 1, "question_text": "What does the floor division operator `//` return when dividing 7 by 2?", "option_a": "3.5", "option_b": "3", "option_c": "4", "option_d": "1", "correct_option": "B", "explanation": "The floor division operator (//) truncates down to the nearest integer. 7 // 2 results in integer 3."}, {"id": 5, "assessment_id": 1, "question_text": "In Python function parameters, what does `**kwargs` capture?", "option_a": "A tuple of positional arguments", "option_b": "A dictionary of keyword arguments", "option_c": "A list of required strings", "option_d": "A pointer to memory", "correct_option": "B", "explanation": "**kwargs captures arbitrary named keyword arguments passed to a function into a standard Python dictionary."}]}]}, {"id": 2, "title": "Data Structures & Algorithms in Practice", "description": "Master algorithmic complexity (Big-O), arrays, linked lists, trees, graphs, sorting algorithms, and dynamic programming.", "category": "Data Structures", "difficulty": "Intermediate", "duration": "10 hours", "instructor": "Prof. Alan Vance", "thumbnail": "", "rating": 4.8, "learning_objectives": "Calculate time and space complexity with Big-O notation\nImplement linear data structures: Linked Lists, Stacks, Queues\nMaster hierarchical trees: Binary Search Trees and Heaps\nSolve algorithmic problems using recursion and Dynamic Programming", "published": 1, "created_at": "2026-09-17 20:07:07.034297", "modules": [{"id": 4, "course_id": 2, "title": "Module 1 — Asymptotic Analysis & Arrays", "description": "Understanding Big-O notation and contiguous memory data structures.", "order": 1, "lessons": [{"id": 7, "module_id": 4, "title": "Big-O Notation: Time and Space Complexity", "content": "<h2>Asymptotic Analysis</h2>\n<p>Big-O notation describes the upper bound of execution time or memory utilization as the input size <code>N</code> scales towards infinity.</p>\n<ul>\n  <li><code>O(1)</code>: Constant Time — Hash map lookups, array index access</li>\n  <li><code>O(log N)</code>: Logarithmic Time — Binary Search</li>\n  <li><code>O(N)</code>: Linear Time — Single loop through an array</li>\n  <li><code>O(N log N)</code>: Linearithmic Time — Merge Sort, Quick Sort (average)</li>\n  <li><code>O(N²)</code>: Quadratic Time — Nested loops, Bubble Sort</li>\n</ul>", "video_url": "https://www.youtube.com/watch?v=kS_JgGzE8MQ", "resource_url": "https://en.wikipedia.org/wiki/Big_O_notation", "duration": "25 mins", "order": 1, "topic": "Data Structures"}, {"id": 8, "module_id": 4, "title": "Dynamic Arrays & Amortized Analysis", "content": "<h2>How Dynamic Arrays Function</h2>\n<p>A static array has a fixed capacity in contiguous memory. A dynamic array allocates an underlying fixed array. When filled to capacity, it allocates a new buffer of 2x size and copies existing elements.</p>\n<div class=\"code-block\">\nclass DynamicArray:\n    def __init__(self):\n        self.capacity = 2\n        self.length = 0\n        self.arr = [None] * self.capacity\n\n    def push(self, val):\n        if self.length == self.capacity:\n            self.resize()\n        self.arr[self.length] = val\n        self.length += 1\n\n    def resize(self):\n        self.capacity *= 2\n        new_arr = [None] * self.capacity\n        for i in range(self.length):\n            new_arr[i] = self.arr[i]\n        self.arr = new_arr\n</div>", "video_url": null, "resource_url": null, "duration": "20 mins", "order": 2, "topic": "Data Structures"}]}, {"id": 5, "course_id": 2, "title": "Module 2 — Linked Lists, Stacks & Queues", "description": "Pointer-linked nodes and LIFO/FIFO patterns.", "order": 2, "lessons": [{"id": 9, "module_id": 5, "title": "Singly & Doubly Linked Lists", "content": "<h2>Linked Lists</h2>\n<p>A Linked List consists of distinct node structures containing a data payload and a pointer reference to the next node in sequence.</p>\n<div class=\"code-block\">\nclass Node:\n    def __init__(self, value):\n        self.value = value\n        self.next = None\n\nclass LinkedList:\n    def __init__(self):\n        self.head = None\n\n    def prepend(self, value):\n        new_node = Node(value)\n        new_node.next = self.head\n        self.head = new_node\n</div>", "video_url": null, "resource_url": null, "duration": "22 mins", "order": 1, "topic": "Data Structures"}]}, {"id": 6, "course_id": 2, "title": "Module 3 — Tree Data Structures & Traversals", "description": "Binary Search Trees, In-Order, Pre-Order, and Post-Order traversal.", "order": 3, "lessons": [{"id": 10, "module_id": 6, "title": "Binary Search Trees (BST) & Search Complexity", "content": "<h2>Binary Search Tree Invariant</h2>\n<p>For any node <code>N</code> in a Binary Search Tree:</p>\n<ul>\n  <li>All keys in node <code>N</code>'s left subtree are strictly less than <code>N.key</code></li>\n  <li>All keys in node <code>N</code>'s right subtree are strictly greater than <code>N.key</code></li>\n</ul>\n<p>Average search, insertion, and deletion complexity is <code>O(log N)</code> in balanced trees.</p>", "video_url": "https://www.youtube.com/watch?v=f5dU3xoEPaA", "resource_url": null, "duration": "30 mins", "order": 1, "topic": "Trees & Graphs"}]}], "assessments": [{"id": 2, "course_id": 2, "title": "Data Structures & Complexity Exam", "description": "Evaluate understanding of Big-O analysis, stack/queue behaviors, and tree invariants.", "pass_percentage": 70.0, "topic": "Data Structures & Algorithms", "questions": [{"id": 6, "assessment_id": 2, "question_text": "What is the average time complexity of searching an element in a balanced Binary Search Tree (BST)?", "option_a": "O(1)", "option_b": "O(log N)", "option_c": "O(N)", "option_d": "O(N log N)", "correct_option": "B", "explanation": "In a balanced binary search tree, half of the search space is eliminated at each step, yielding O(log N) average time complexity."}, {"id": 7, "assessment_id": 2, "question_text": "Which data structure operates strictly on a Last-In, First-Out (LIFO) protocol?", "option_a": "Queue", "option_b": "Stack", "option_c": "Priority Queue", "option_d": "Array", "correct_option": "B", "explanation": "A Stack operates on a LIFO basis: the element pushed last is the first to be popped off."}, {"id": 8, "assessment_id": 2, "question_text": "What is the worst-case time complexity of Quick Sort?", "option_a": "O(N log N)", "option_b": "O(N²)", "option_c": "O(N)", "option_d": "O(log N)", "correct_option": "B", "explanation": "When an unbalanced pivot is repeatedly chosen (such as the smallest or largest item on an already sorted array), Quick Sort degrades to O(N²)."}, {"id": 9, "assessment_id": 2, "question_text": "What is the time complexity of looking up a key in a standard Hash Map with good hash distribution?", "option_a": "O(1) average", "option_b": "O(log N)", "option_c": "O(N)", "option_d": "O(N²)", "correct_option": "A", "explanation": "Hash maps use direct array index addressing derived from hash codes, providing O(1) average time lookups."}, {"id": 10, "assessment_id": 2, "question_text": "Which tree traversal algorithm visits nodes in the order: Left Subtree, Root, Right Subtree?", "option_a": "Pre-Order", "option_b": "In-Order", "option_c": "Post-Order", "option_d": "Breadth-First", "correct_option": "B", "explanation": "In-Order traversal processes the left child, then the parent (root), then the right child, which prints BST elements in sorted ascending order."}]}]}, {"id": 3, "title": "Database Management Systems & SQL Mastery", "description": "Relational database modeling, SQL querying, indexing, ACID transactions, normalization, and SQLAlchemy ORM patterns.", "category": "Database Management", "difficulty": "Intermediate", "duration": "7 hours", "instructor": "Marcus Sterling", "thumbnail": "", "rating": 4.9, "learning_objectives": "Design normalized schemas up to 3rd Normal Form (3NF)\nWrite complex SQL joins, aggregations, and subqueries\nOptimize query execution plans with B-Tree indexes\nUnderstand ACID guarantees and isolation levels", "published": 1, "created_at": "2026-09-17 20:07:07.068725", "modules": [{"id": 7, "course_id": 3, "title": "Module 1 — Relational Modeling & Schema Design", "description": "Tables, keys, constraints, and normalization.", "order": 1, "lessons": [{"id": 11, "module_id": 7, "title": "Primary Keys, Foreign Keys & Constraints", "content": "<h2>Relational Data Modeling</h2>\n<p>Relational databases structure data into tables composed of rows (tuples) and columns (attributes).</p>\n<ul>\n  <li><strong>Primary Key (PK):</strong> Unique, non-null identifier for a row.</li>\n  <li><strong>Foreign Key (FK):</strong> Enforces referential integrity linking a child record to its parent.</li>\n  <li><strong>CASCADE:</strong> Automatic deletion of orphaned child rows when parent is deleted.</li>\n</ul>\n<div class=\"code-block\">\nCREATE TABLE users (\n    id SERIAL PRIMARY KEY,\n    email VARCHAR(150) UNIQUE NOT NULL,\n    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n\nCREATE TABLE enrollments (\n    id SERIAL PRIMARY KEY,\n    user_id INT NOT NULL REFERENCES users(id) ON DELETE CASCADE,\n    course_id INT NOT NULL,\n    enrolled_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP\n);\n</div>", "video_url": "https://www.youtube.com/watch?v=HXV3zeQKqGY", "resource_url": "https://www.postgresql.org/docs/current/ddl-constraints.html", "duration": "18 mins", "order": 1, "topic": "General"}, {"id": 12, "module_id": 7, "title": "Normalization: 1NF, 2NF, and 3NF", "content": "<h2>Database Normalization Principles</h2>\n<p>Normalization reduces data redundancy and prevents insertion, update, and deletion anomalies.</p>\n<ul>\n  <li><strong>1NF (First Normal Form):</strong> Atomic values per cell, unique rows.</li>\n  <li><strong>2NF (Second Normal Form):</strong> In 1NF and no partial dependencies on composite keys.</li>\n  <li><strong>3NF (Third Normal Form):</strong> In 2NF and no transitive functional dependencies.</li>\n</ul>", "video_url": null, "resource_url": null, "duration": "25 mins", "order": 2, "topic": "SQL & Modeling"}]}, {"id": 8, "course_id": 3, "title": "Module 2 — Advanced SQL Queries & Joins", "description": "Inner, Left, and Outer Joins, Group By, and Window Functions.", "order": 2, "lessons": [{"id": 13, "module_id": 8, "title": "SQL Joins, Aggregations & Grouping", "content": "<h2>Mastering SQL Joins</h2>\n<div class=\"code-block\">\n-- Querying total enrollments per course category\nSELECT \n    c.category,\n    COUNT(e.id) AS total_enrollments,\n    ROUND(AVG(c.rating), 2) AS average_rating\nFROM courses c\nLEFT JOIN enrollments e ON c.id = e.course_id\nGROUP BY c.category\nHAVING COUNT(e.id) > 0\nORDER BY total_enrollments DESC;\n</div>", "video_url": "https://www.youtube.com/watch?v=9yeOJ0ZMUYw", "resource_url": null, "duration": "30 mins", "order": 1, "topic": "SQL & Modeling"}]}, {"id": 9, "course_id": 3, "title": "Module 3 — Transactions & Indexing", "description": "ACID properties, B-Tree indexes, and Query optimization.", "order": 3, "lessons": [{"id": 14, "module_id": 9, "title": "ACID Properties & Transaction Isolation", "content": "<h2>The ACID Guarantees</h2>\n<ul>\n  <li><strong>Atomicity:</strong> All operations in a transaction succeed, or the entire transaction rolls back.</li>\n  <li><strong>Consistency:</strong> Transactions transition the database from one valid state to another.</li>\n  <li><strong>Isolation:</strong> Concurrent transactions execute without dirty read interferences.</li>\n  <li><strong>Durability:</strong> Once committed, transaction effects persist even through system crashes.</li>\n</ul>", "video_url": null, "resource_url": null, "duration": "22 mins", "order": 1, "topic": "General"}]}], "assessments": [{"id": 3, "course_id": 3, "title": "Database Systems & SQL Assessment", "description": "Validate database schema design, join syntax, normalization rules, and ACID concepts.", "pass_percentage": 70.0, "topic": "SQL & Relational Modeling", "questions": [{"id": 11, "assessment_id": 3, "question_text": "What does the 'A' in ACID transaction guarantees represent?", "option_a": "Availability", "option_b": "Atomicity", "option_c": "Authentication", "option_d": "Asynchronous", "correct_option": "B", "explanation": "ACID stands for Atomicity, Consistency, Isolation, and Durability."}, {"id": 12, "assessment_id": 3, "question_text": "Which SQL JOIN returns all rows from the left table and matched rows from the right table?", "option_a": "INNER JOIN", "option_b": "LEFT JOIN", "option_c": "RIGHT JOIN", "option_d": "CROSS JOIN", "correct_option": "B", "explanation": "A LEFT JOIN preserves every row from the left table, populating NULL for right table columns when no match exists."}, {"id": 13, "assessment_id": 3, "question_text": "What is the primary objective of Database Normalization?", "option_a": "Increase disk consumption", "option_b": "Eliminate redundant data and prevent modification anomalies", "option_c": "Encrypt confidential records", "option_d": "Disable foreign key constraints", "correct_option": "B", "explanation": "Normalization organizes schema tables to minimize duplicate data and eliminate update/deletion anomalies."}, {"id": 14, "assessment_id": 3, "question_text": "Which index data structure is predominantly used by relational database engines (PostgreSQL, MySQL, SQLite)?", "option_a": "Binary Heap", "option_b": "B-Tree (Balanced Tree)", "option_c": "Linked List", "option_d": "Stack", "correct_option": "B", "explanation": "B-Trees and B+ Trees allow efficient logarithmic searches, range queries, and sequential traversals on disk blocks."}, {"id": 15, "assessment_id": 3, "question_text": "In SQL, which clause filters aggregated rows produced by a GROUP BY statement?", "option_a": "WHERE", "option_b": "HAVING", "option_c": "ORDER BY", "option_d": "LIMIT", "correct_option": "B", "explanation": "WHERE filters rows prior to aggregation, while HAVING filters group aggregations (e.g. HAVING COUNT(*) > 5)."}]}]}, {"id": 4, "title": "Modern Web Development with FastAPI & REST Architecture", "description": "Architect high-performance APIs with Python, FastAPI, Pydantic data validation, JWT authentication, and responsive client-side UI.", "category": "Web Development", "difficulty": "Intermediate", "duration": "9 hours", "instructor": "Elena Cruz", "thumbnail": "", "rating": 4.9, "learning_objectives": "Build production REST APIs with FastAPI routing and OpenAPI docs\nValidate request and response schemas with Pydantic v2\nImplement secure JWT token authorization and password hashing\nStructure scalable multi-layer web architectures", "published": 1, "created_at": "2026-09-17 20:07:07.109384", "modules": [{"id": 10, "course_id": 4, "title": "Module 1 — REST Principles & FastAPI Architecture", "description": "HTTP methods, status codes, and routing.", "order": 1, "lessons": [{"id": 15, "module_id": 10, "title": "REST Architecture & HTTP Semantics", "content": "<h2>Modern API Architecture</h2>\n<p>Representational State Transfer (REST) leverages HTTP methods to operate on web resources:</p>\n<ul>\n  <li><code>GET</code>: Safe, idempotent retrieval</li>\n  <li><code>POST</code>: Non-idempotent creation</li>\n  <li><code>PUT / PATCH</code>: Full / Partial resource mutation</li>\n  <li><code>DELETE</code>: Resource removal</li>\n</ul>\n<div class=\"code-block\">\nfrom fastapi import FastAPI\n\napp = FastAPI(title=\"EduPulse API\")\n\n@app.get(\"/api/health\")\ndef health_check():\n    return {\"status\": \"healthy\", \"version\": \"1.0.0\"}\n</div>", "video_url": "https://www.youtube.com/watch?v=0sOvCWFmrtA", "resource_url": "https://fastapi.tiangolo.com/", "duration": "20 mins", "order": 1, "topic": "REST APIs"}, {"id": 16, "module_id": 10, "title": "Pydantic Schemas & Request Validation", "content": "<h2>Strict Data Validation with Pydantic</h2>\n<p>Pydantic enforces strict type safety, data parsing, and auto-generates JSON Schema specifications.</p>\n<div class=\"code-block\">\nfrom pydantic import BaseModel, EmailStr, Field\n\nclass UserCreate(BaseModel):\n    name: str = Field(..., min_length=2, max_length=50)\n    email: EmailStr\n    password: str = Field(..., min_length=8)\n</div>", "video_url": null, "resource_url": "https://docs.pydantic.dev/", "duration": "24 mins", "order": 2, "topic": "REST APIs"}]}, {"id": 11, "course_id": 4, "title": "Module 2 — Authentication & Security", "description": "Bcrypt hashing, JWT bearer tokens, and route protection.", "order": 2, "lessons": [{"id": 17, "module_id": 11, "title": "Password Hashing & JWT Bearer Tokens", "content": "<h2>Production Security Patterns</h2>\n<p>Never store plain-text passwords. Use adaptive hashing (bcrypt) and issue stateless JSON Web Tokens containing cryptographically verified claims.</p>\n<div class=\"code-block\">\n# JWT Structure\nHeader.Payload.Signature\n# Stored securely in HttpOnly cookies or Bearer Authorization headers\n</div>", "video_url": null, "resource_url": "https://jwt.io/", "duration": "28 mins", "order": 1, "topic": "General"}]}, {"id": 12, "course_id": 4, "title": "Module 3 — Full-Stack Integration", "description": "Jinja2 server templating, asynchronous fetch requests, and responsive CSS.", "order": 3, "lessons": [{"id": 18, "module_id": 12, "title": "Server-Rendered UI with Jinja2 & Dynamic JavaScript", "content": "<h2>Modern Server-Driven Web UI</h2>\n<p>Combining FastAPI, Jinja2 templating, and Vanilla JavaScript provides instant page loads, SEO optimization, and clean interactive client experiences without massive frontend framework overhead.</p>", "video_url": null, "resource_url": "https://jinja.palletsprojects.com/", "duration": "25 mins", "order": 1, "topic": "Data Structures"}]}], "assessments": [{"id": 4, "course_id": 4, "title": "Web Architecture & API Security Exam", "description": "Assess your understanding of REST methods, HTTP status codes, JWT tokens, and Pydantic validation.", "pass_percentage": 70.0, "topic": "Web Architecture & APIs", "questions": [{"id": 16, "assessment_id": 4, "question_text": "Which HTTP status code signifies that a new resource has been successfully created?", "option_a": "200 OK", "option_b": "201 Created", "option_c": "204 No Content", "option_d": "301 Moved Permanently", "correct_option": "B", "explanation": "201 Created is the standard HTTP status indicating that the request succeeded and a new resource was provisioned."}, {"id": 17, "assessment_id": 4, "question_text": "Why should password hashes be generated with a cryptographic salt?", "option_a": "To reduce hash length", "option_b": "To defend against rainbow table lookups", "option_c": "To convert the password to plain-text", "option_d": "To avoid using CPU power", "correct_option": "B", "explanation": "A unique cryptographic salt ensures identical passwords produce distinct hashes, neutralizing precomputed rainbow table attacks."}, {"id": 18, "assessment_id": 4, "question_text": "Which component of a JWT ensures that its payload has not been tampered with?", "option_a": "The Header", "option_b": "The Cryptographic Signature", "option_c": "The JSON formatting", "option_d": "The Base64 encoding", "correct_option": "B", "explanation": "The signature is generated using the secret key; any modification to the header or payload invalidates the signature."}, {"id": 19, "assessment_id": 4, "question_text": "What does Pydantic do when incoming request data fails field validation rules?", "option_a": "Silently substitutes empty values", "option_b": "Raises a ValidationError and returns HTTP 422 Unprocessable Entity", "option_c": "Crashes the server process", "option_d": "Redirects to the home page", "correct_option": "B", "explanation": "FastAPI and Pydantic automatically return a structured 422 Unprocessable Entity response specifying exactly which fields failed validation."}, {"id": 20, "assessment_id": 4, "question_text": "Which HTTP method is defined as idempotent according to RFC specifications?", "option_a": "POST", "option_b": "PUT", "option_c": "CONNECT", "option_d": "PATCH (when appending)", "correct_option": "B", "explanation": "PUT is idempotent: executing identical PUT requests repeate   <!-- Complete Standalone Application Logic -->
  <script>
    // ===================================================================
    // State Store & Persistence
    // ===================================================================
    class StateManager {
      constructor() {
        this.STORAGE_KEY = 'edupulse_standalone_v1';
        this.state = this.loadState();
      }

      loadState() {
        try {
          const raw = localStorage.getItem(this.STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.courses && parsed.users) {
              return parsed;
            }
          }
        } catch (e) {
          console.warn('Could not parse localStorage state:', e);
        }
        return this.getDefaultState();
      }

      getDefaultState() {
        // Deep clone initial data
        const clone = JSON.parse(JSON.stringify(INITIAL_DATA));
        // Default persona is student (ID 2)
        const defaultUser = clone.users.find(u => u.id === 2) || clone.users[0];
        return {
          ...clone,
          currentUser: defaultUser
        };
      }

      save() {
        try {
          localStorage.setItem(this.STORAGE_KEY, JSON.stringify(this.state));
        } catch (e) {
          console.error('Failed to save state to localStorage:', e);
        }
      }

      reset() {
        this.state = this.getDefaultState();
        this.save();
      }
    }

    const store = new StateManager();

    // ===================================================================
    // UI Helpers (Toast, Modals, Dropdowns)
    // ===================================================================
    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;

      const toast = document.createElement("div");
      toast.className = `alert alert-${type === "error" ? "danger" : type === "success" ? "success" : "info"}`;
      toast.style.boxShadow = "0 10px 15px -3px rgba(0,0,0,0.15)";
      toast.style.animation = "fadeIn 0.25s ease";
      toast.style.minWidth = "260px";
      toast.style.display = "flex";
      toast.style.alignItems = "center";
      toast.style.gap = "0.75rem";
      
      const icon = type === "success" ? "circle-check" : type === "error" ? "circle-exclamation" : "circle-info";
      toast.innerHTML = `<i class="fa-solid fa-${icon}"></i> <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.3s ease";
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function closeModal() {
      const modal = document.querySelector('.modal-backdrop.show');
      if (modal) {
        modal.classList.remove('show');
      }
    }

    // ===================================================================
    // Offline / Online Chart Renderer
    // ===================================================================
    function renderLineChart(canvasId, labels, data, labelName = "Score (%)", color = "#4f46e5") {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      if (typeof Chart !== 'undefined') {
        // Destroy existing chart on canvas if present
        if (canvas._chartInstance) {
          canvas._chartInstance.destroy();
        }
        const ctx = canvas.getContext('2d');
        canvas._chartInstance = new Chart(ctx, {
          type: "line",
          data: {
            labels: labels,
            datasets: [{
              label: labelName,
              data: data,
              borderColor: color,
              backgroundColor: color === "#0ea5e9" ? "rgba(14, 165, 233, 0.08)" : "rgba(79, 70, 229, 0.08)",
              fill: true,
              tension: 0.35,
              pointBackgroundColor: color,
              pointRadius: 5,
              borderWidth: 2.5
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: "#f1f5f9" },
                ticks: { color: "#64748b" }
              },
              x: {
                grid: { display: false },
                ticks: { color: "#64748b" }
              }
            }
          }
        });
      } else {
        // High quality fallback if Chart.js CDN is unavailable
        renderSvgLineChart(canvas, labels, data, color);
      }
    }

    function renderBarChart(canvasId, labels, data, labelName = "Students", color = "#4f46e5") {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      if (typeof Chart !== 'undefined') {
        if (canvas._chartInstance) {
          canvas._chartInstance.destroy();
        }
        const ctx = canvas.getContext('2d');
        canvas._chartInstance = new Chart(ctx, {
          type: "bar",
          data: {
            labels: labels,
            datasets: [{
              label: labelName,
              data: data,
              backgroundColor: color,
              borderRadius: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                beginAtZero: true,
                grid: { color: "#f1f5f9" },
                ticks: { color: "#64748b" }
              },
              x: {
                grid: { display: false },
                ticks: { color: "#64748b" }
              }
            }
          }
        });
      } else {
        renderSvgBarChart(canvas, labels, data, color);
      }
    }

    function renderSvgLineChart(canvas, labels, data, color) {
      const parent = canvas.parentElement;
      const max = Math.max(...data, 100);
      let points = "";
      const count = Math.max(data.length - 1, 1);
      data.forEach((val, idx) => {
        const x = (idx / count) * 460 + 20;
        const y = 200 - (val / max) * 160;
        points += `${x},${y} `;
      });

      parent.innerHTML = `
        <svg viewBox="0 0 500 220" style="width: 100%; height: 100%;">
          <line x1="20" y1="200" x2="480" y2="200" stroke="#e2e8f0" stroke-width="1.5" />
          <line x1="20" y1="120" x2="480" y2="120" stroke="#f1f5f9" stroke-width="1" />
          <line x1="20" y1="40" x2="480" y2="40" stroke="#f1f5f9" stroke-width="1" />
          <polyline fill="none" stroke="${color}" stroke-width="3" points="${points.trim()}" />
          ${data.map((val, idx) => {
            const x = (idx / count) * 460 + 20;
            const y = 200 - (val / max) * 160;
            return `<circle cx="${x}" cy="${y}" r="4" fill="${color}" /><text x="${x}" y="${y - 8}" font-size="11" fill="#475569" text-anchor="middle">${val}%</text>`;
          }).join('')}
        </svg>
      `;
    }

    function renderSvgBarChart(canvas, labels, data, color) {
      const parent = canvas.parentElement;
      const max = Math.max(...data, 10);
      const barWidth = 40;
      parent.innerHTML = `
        <svg viewBox="0 0 500 220" style="width: 100%; height: 100%;">
          <line x1="20" y1="190" x2="480" y2="190" stroke="#e2e8f0" stroke-width="1.5" />
          ${data.map((val, idx) => {
            const x = 50 + idx * 105;
            const h = (val / max) * 150;
            const y = 190 - h;
            const label = labels[idx] ? labels[idx].substring(0, 10) + '...' : '';
            return `
              <rect x="${x}" y="${y}" width="${barWidth}" height="${h}" rx="4" fill="${color}" />
              <text x="${x + barWidth / 2}" y="${y - 6}" font-size="11" fill="#0f172a" font-weight="bold" text-anchor="middle">${val}</text>
              <text x="${x + barWidth / 2}" y="208" font-size="10" fill="#64748b" text-anchor="middle">${label}</text>
            `;
          }).join('')}
        </svg>
      `;
    }

    // ===================================================================
    // Main Standalone App Class
    // ===================================================================
    class EduPulseApp {
      constructor() {
        this.init();
      }

      init() {
        window.addEventListener('hashchange', () => this.handleRoute());
        window.addEventListener('click', (e) => {
          // Close dropdowns when clicking outside
          if (!e.target.closest('.user-dropdown')) {
            document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show'));
          }
        });
        this.updatePersonaBadge();
        this.handleRoute();
      }

      setPersona(role) {
        if (role === 'student') {
          store.state.currentUser = store.state.users.find(u => u.role === 'student') || store.state.users[1];
          showToast(`Switched to Demo Student persona (${store.state.currentUser.name})`, 'success');
        } else if (role === 'admin') {
          store.state.currentUser = store.state.users.find(u => u.role === 'admin') || store.state.users[0];
          showToast(`Switched to Administrator persona (${store.state.currentUser.name})`, 'success');
        } else {
          store.state.currentUser = null;
          showToast('Switched to Guest / Logged Out persona', 'info');
        }
        store.save();
        this.updatePersonaBadge();

        // Redirect appropriately
        if (role === 'admin') {
          this.navigate('#/admin/dashboard');
        } else if (role === 'student') {
          this.navigate('#/dashboard');
        } else {
          this.navigate('#/');
        }
      }

      updatePersonaBadge() {
        const u = store.state.currentUser;
        const text = document.getElementById('active-persona-text');
        const bStudent = document.getElementById('btn-persona-student');
        const bAdmin = document.getElementById('btn-persona-admin');
        const bGuest = document.getElementById('btn-persona-guest');

        bStudent.classList.remove('active');
        bAdmin.classList.remove('active');
        bGuest.classList.remove('active');

        if (!u) {
          text.innerText = 'Guest (Not Signed In)';
          bGuest.classList.add('active');
        } else if (u.role === 'admin') {
          text.innerText = `Admin: ${u.name}`;
          bAdmin.classList.add('active');
        } else {
          text.innerText = `Student: ${u.name}`;
          bStudent.classList.add('active');
        }
      }

      resetDemoState() {
        if (confirm('Reset all demo state to original default database values?')) {
          store.reset();
          this.updatePersonaBadge();
          showToast('Demo data restored to pristine initial records!', 'success');
          this.navigate('#/');
        }
      }

      navigate(hash) {
        window.location.hash = hash;
      }

      getHashParts() {
        const hash = window.location.hash.slice(1) || '/';
        const [path, queryString] = hash.split('?');
        const params = new URLSearchParams(queryString || '');
        return { path, params };
      }

      // =================================================================
      // Route Dispatcher
      // =================================================================
      handleRoute() {
        const { path, params } = this.getHashParts();
        const root = document.getElementById('app-root');
        window.scrollTo(0, 0);

        // Check if admin route
        if (path.startsWith('/admin')) {
          this.renderAdminLayout(path, params);
          return;
        }

        // Standard public/student route
        let contentHtml = '';
        if (path === '/' || path === '') {
          contentHtml = this.renderHomeView();
        } else if (path === '/courses') {
          contentHtml = this.renderCoursesView(params);
        } else if (path.match(/^\/courses\/(\d+)$/)) {
          const courseId = parseInt(path.match(/^\/courses\/(\d+)$/)[1]);
          contentHtml = this.renderCourseDetailView(courseId);
        } else if (path.match(/^\/courses\/(\d+)\/learn$/)) {
          const courseId = parseInt(path.match(/^\/courses\/(\d+)\/learn$/)[1]);
          this.handleLearnJump(courseId);
          return;
        } else if (path.match(/^\/courses\/(\d+)\/lessons\/(\d+)$/)) {
          const m = path.match(/^\/courses\/(\d+)\/lessons\/(\d+)$/);
          contentHtml = this.renderLessonView(parseInt(m[1]), parseInt(m[2]));
        } else if (path.match(/^\/courses\/(\d+)\/assessments\/(\d+)$/)) {
          const m = path.match(/^\/courses\/(\d+)\/assessments\/(\d+)$/);
          contentHtml = this.renderAssessmentView(parseInt(m[1]), parseInt(m[2]));
        } else if (path.match(/^\/assessments\/results\/(\d+)$/)) {
          const resId = parseInt(path.match(/^\/assessments\/results\/(\d+)$/)[1]);
          contentHtml = this.renderResultView(resId);
        } else if (path === '/dashboard') {
          contentHtml = this.renderDashboardView();
        } else if (path === '/progress') {
          contentHtml = this.renderProgressView();
        } else if (path === '/profile') {
          contentHtml = this.renderProfileView();
        } else if (path === '/login') {
          contentHtml = this.renderLoginView();
        } else if (path === '/register') {
          contentHtml = this.renderRegisterView();
        } else {
          contentHtml = this.renderHomeView();
        }

        root.innerHTML = `

      getCourseIcon(title) {
        if (title.includes('Python')) return { icon: 'fa-brands fa-python', color: '#60a5fa' };
        if (title.includes('Data Structure')) return { icon: 'fa-solid fa-network-wired', color: '#a78bfa' };
        if (title.includes('Database')) return { icon: 'fa-solid fa-database', color: '#34d399' };
        return { icon: 'fa-solid fa-code', color: '#f472b6' };
      }

      getCourseLessonsCount(course) {
        let count = 0;
        if (course.modules) {
          course.modules.forEach(m => count += (m.lessons ? m.lessons.length : 0));
        }
        return count;
      }

      getUserCourseProgress(userId, courseId) {
        const course = store.state.courses.find(c => c.id === courseId);
        if (!course) return 0;
        const totalLessons = this.getCourseLessonsCount(course);
        if (totalLessons === 0) return 0;

        let completed = 0;
        if (course.modules) {
          course.modules.forEach(m => {
            if (m.lessons) {
              m.lessons.forEach(l => {
                const prog = store.state.lesson_progress.find(lp => lp.user_id === userId && lp.lesson_id === l.id && lp.completed);
                if (prog) completed++;
              });
            }
          });
        }
        return Math.round((completed / totalLessons) * 100);
      }

      isUserEnrolled(userId, courseId) {
        if (!userId) return false;
        return store.state.enrollments.some(e => e.user_id === userId && e.course_id === courseId);
      }

      getStudentDashboardStats(userId) {
        const userEnrs = store.state.enrollments.filter(e => e.user_id === userId);
        const enrolledCount = userEnrs.length;
        let completedCoursesCount = 0;

        userEnrs.forEach(e => {
          if (this.getUserCourseProgress(userId, e.course_id) === 100) {
            completedCoursesCount++;
          }
        });

        const completedLessonsCount = store.state.lesson_progress.filter(lp => lp.user_id === userId && lp.completed).length;

        const userResults = store.state.results.filter(r => r.user_id === userId);
        let avgScore = 0;
        if (userResults.length > 0) {
          const sum = userResults.reduce((acc, curr) => acc + (curr.percentage || 0), 0);
          avgScore = Math.round(sum / userResults.length);
        }

        return {
          enrolledCount,
          completedCoursesCount,
          completedLessonsCount,
          avgScore
        };
      }

      handleLearnJump(courseId) {
        const course = store.state.courses.find(c => c.id === courseId);
        if (!course || !course.modules || course.modules.length === 0) {
          this.navigate(`#/courses/${courseId}`);
          return;
        }

        // Find first incomplete lesson, or first lesson
        const userId = store.state.currentUser ? store.state.currentUser.id : null;
        let targetLesson = null;

        for (const m of course.modules) {
          if (m.lessons) {
            for (const l of m.lessons) {
              if (userId) {
                const done = store.state.lesson_progress.some(lp => lp.user_id === userId && lp.lesson_id === l.id && lp.completed);
                if (!done) {
                  targetLesson = l;
                  break;
                }
              } else {
                targetLesson = l;
                break;
              }
            }
          }
          if (targetLesson) break;
        }

        if (!targetLesson && course.modules[0] && course.modules[0].lessons && course.modules[0].lessons[0]) {
          targetLesson = course.modules[0].lessons[0];
        }

        if (targetLesson) {
          this.navigate(`#/courses/${courseId}/lessons/${targetLesson.id}`);
        } else {
          this.navigate(`#/courses/${courseId}`);
        }
      }

      enrollUserInCourse(courseId) {
        const u = store.state.currentUser;
        if (!u) {
          showToast('Please sign in first to enroll in courses.', 'info');
          this.navigate('#/login');
          return;
        }

        if (this.isUserEnrolled(u.id, courseId)) {
          showToast('Already enrolled in this course!', 'info');
          this.handleLearnJump(courseId);
          return;
        }

        store.state.enrollments.push({
          user_id: u.id,
          course_id: courseId,
          enrolled_at: new Date().toISOString()
        });
        store.save();

        showToast('Successfully enrolled! Starting your course...', 'success');
        this.handleLearnJump(courseId);
      }

      markLessonComplete(courseId, lessonId, nextLessonId) {
        const u = store.state.currentUser;
        if (!u) {
          showToast('Please sign in to record progress.', 'info');
          return;
        }

        // Add or update lesson progress
        const existing = store.state.lesson_progress.find(lp => lp.user_id === u.id && lp.lesson_id === lessonId);
        if (existing) {
          existing.completed = true;
          existing.completed_at = new Date().toISOString();
        } else {
          store.state.lesson_progress.push({
            user_id: u.id,
            lesson_id: lessonId,
            completed: true,
            completed_at: new Date().toISOString()
          });
        }
        store.save();

        showToast('Lesson marked complete! Progress saved.', 'success');

        if (nextLessonId) {
          setTimeout(() => {
            this.navigate(`#/courses/${courseId}/lessons/${nextLessonId}`);
          }, 600);
        } else {
          // Check if assessment exists
          const course = store.state.courses.find(c => c.id === courseId);
          if (course && course.assessments && course.assessments.length > 0) {
            showToast('All lessons completed! Opening course assessment...', 'success');
            setTimeout(() => {
              this.navigate(`#/courses/${courseId}/assessments/${course.assessments[0].id}`);
            }, 800);
          } else {
            this.navigate('#/dashboard');
          }
        }
      }

      submitAssessment(courseId, assessmentId, formData) {
        const u = store.state.currentUser;
        if (!u) {
          showToast('Please sign in to submit assessments.', 'info');
          return;
        }

        const course = store.state.courses.find(c => c.id === courseId);
        const assessment = course.assessments.find(a => a.id === assessmentId);
        if (!assessment) return;

        let score = 0;
        const total = assessment.questions.length;
        const answers = {};

        assessment.questions.forEach(q => {
          const userChoice = formData.get(`q_${q.id}`);
          answers[q.id] = userChoice;
          if (userChoice && userChoice.toUpperCase() === q.correct_option.toUpperCase()) {
            score++;
          }
        });

        const percentage = Math.round((score / total) * 100);
        const passed = percentage >= assessment.pass_percentage;

        const newId = store.state.results.length > 0 ? Math.max(...store.state.results.map(r => r.id)) + 1 : 1;
        const newResult = {
          id: newId,
          user_id: u.id,
          assessment_id: assessmentId,
          score: score,
          total_questions: total,
          percentage: percentage,
          passed: passed,
          completed_at: new Date().toISOString(),
          answers: answers
        };

        store.state.results.push(newResult);
        store.save();

        showToast(passed ? `🎉 Congratulations! Passed with ${percentage}%` : `Submitted. Score: ${percentage}%. Needs review.`, passed ? 'success' : 'info');
        this.navigate(`#/assessments/results/${newId}`);
      }
