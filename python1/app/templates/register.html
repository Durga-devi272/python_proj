{% extends "base.html" %}

{% block title %}Create Account — EduPulse{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 3rem 1.5rem; background: var(--slate-50);">
  <div style="width: 100%; max-width: 480px;">
    
    <div class="card" style="padding: 2.25rem; box-shadow: var(--shadow-lg); border-radius: var(--radius-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.25rem;">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2 style="font-size: 1.6rem; color: var(--slate-900); margin-bottom: 0.35rem;">Join EduPulse</h2>
        <p style="color: var(--slate-500); font-size: 0.9rem;">Start exploring courses and tracking your technical skills</p>
      </div>

      {% if error %}
      <div class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="/auth/register" method="POST">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="name" name="name" class="form-control" placeholder="Jane Doe" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope"></i>
            <input type="email" id="email" name="email" class="form-control" placeholder="jane@example.com" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password</label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-shield-check"></i>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" minlength="6" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
          <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--slate-500);">
        Already have an account? 
        <a href="/login" style="font-weight: 600; color: var(--primary);">Sign in here</a>
      </div>
    </div>

  </div>
</div>
{% endblock %}
